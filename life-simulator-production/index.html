function inferLegacyContractLedger(con){
 const year=Math.max(1,S.year||1),rookie=(con.type==="Rookie Contract"||(con.label||"").includes("Rookie")||!!(S.draftProcess&&S.draftProcess.pick));
 if(typeof con.startYear!=="number"){
   if(rookie)con.startYear=1;
   else{
     const used=Math.max(0,(con.years||0)-(con.yearsRemaining||con.years||0));
     con.startYear=Math.max(1,(S.stage==="Offseason"?year+1:year)-used)
   }

 if(typeof con.lastProcessedOffseasonYear!=="number"){

 if(!con.type)con.type=(con.label||"").includes("Rookie")?"Rookie Contract":(con.label||"").includes("Extension")?"Extension":"NBA Contract";

function combineComplete(){const e=S.draftProcess&&S.draftProcess.events;return !!(e&&e.shooting&&e.agility&&e.scrimmage)}
function combineEvent(id){if(S.stage!=="Draft Combine"){toast("You are not in the Draft Combine");return}const e=S.draftProcess.events;if(e[id]){toast("That combine event is already complete");return}let boost=0,label="";if(id==="shooting"){boost=Math.max(1,Math.min(5,Math.round((S.player.attrs.Shooting-55)/9)+Math.floor(Math.random()*2)));label="Shooting Drill"}else if(id==="agility"){boost=Math.max(1,Math.min(5,Math.round((S.player.attrs.Athleticism-55)/9)+Math.floor(Math.random()*2)));label="Agility Test"}else{boost=Math.max(1,Math.min(6,Math.round(((S.player.attrs.IQ+S.player.attrs.Playmaking+S.player.attrs.Defense)/3-55)/8)+Math.floor(Math.random()*2)));label="5-on-5 Scrimmage"}e[id]=true;S.draftProcess.boost+=boost;S.player.draft=Math.min(99,S.player.draft+boost);S.player.xp+=60+boost*10;if(combineComplete())S.draftProcess.combineDone=true;S.news.unshift(label+" complete: Draft Stock +"+boost+".");save();render();toast(label+" • Draft Stock +"+boost)}

function careerPathLevel(id){
 const xp=Math.max(0,S.careerPaths?.xp?.[id]||0);
 return xp>=700?4:xp>=350?3:xp>=150?2:1
}
function careerPathNext(id){const xp=Math.max(0,S.careerPaths?.xp?.[id]||0),next=xp<150?150:xp<350?350:xp<700?700:null;return next}
function careerPathProgress(id){const xp=Math.max(0,S.careerPaths?.xp?.[id]||0),level=careerPathLevel(id),floor=level===1?0:level===2?150:level===3?350:700,ceil=level===1?150:level===2?350:level===3?700:700;return level===4?100:Math.max(0,Math.min(100,(xp-floor)/(ceil-floor)*100))}
function addCareerPathXP(id,amt,reason){
 if(!(S.stage==="NBA"||S.stage==="Offseason")||!S.careerPaths||!S.careerPaths.xp[id]&&S.careerPaths.xp[id]!==0)return;
 const before=careerPathLevel(id);S.careerPaths.xp[id]=Math.max(0,(S.careerPaths.xp[id]||0)+Math.round(amt));const after=careerPathLevel(id);
 if(after>before){const p=CAREER_PATHS.find(x=>x.id===id);S.news.unshift(p.name+" reached Level "+after+" — "+p.unlocks[after-1]+".")}
}
function pathBonus(key){
 const lv=id=>careerPathLevel(id)-1;
 const map={
 followerGrowth:lv("media")*.05+lv("superstar")*.025,
 endorsementMoney:lv("business")*.05+lv("media")*.025,
 passiveIncome:lv("business")*.06,
 contractValue:lv("superstar")*.025+lv("franchise")*.02,
 coachTrust:lv("franchise")*.35+lv("veteran")*.45,
 rosterInfluence:lv("dynasty")*5,
 recovery:lv("veteran"),
 trainingXP:lv("veteran")*.04,
 homeBoost:lv("franchise")*.6
 };
 return map[key]||0
}
function currentCareerIdentity(){

}

ight</button></section>':'')+'</div>'}
function ensureLeagueRosters(){
 if(!S.leagueRosters)S.leagueRosters={};
 NBA_TEAMS.forEach(t=>{
   if(!Array.isArray(S.leagueRosters[t.id]))S.leagueRosters[t.id]=t.stars.map(p=>({...p,source:"veteran",yearsPro:5}));
   S.leagueRosters[t.id].forEach((p,i)=>{
     if(typeof p.yearsPro!=="number")p.yearsPro=5;
     if(typeof p.age!=="number")p.age=24+p.yearsPro;
     if(typeof p.ovr!=="number")p.ovr=Math.max(68,Math.min(95,Math.round(66+(p.ppg||10)*.75)));
     if(typeof p.potential!=="number")p.potential=Math.min(96,p.ovr+(p.yearsPro<=5?6:2));
     if(!p.personality)p.personality=["Loyal","Competitive","Money-Focused","Ring Chaser","Laid Back","Leader"][(i+t.id.length)%6];
     if(typeof p.contractYears!=="number")p.contractYears=1+((i+t.id.length)%4);
     if(typeof p.contractValue!=="number")p.contractValue=Math.round(p.ovr*p.ovr*26000);
     if(!p.career){const gp=Math.max(0,p.yearsPro*76);p.career={gp,pts:Math.round((p.ppg||0)*gp),ast:Math.round((p.apg||0)*gp),reb:Math.round((p.rpg||0)*gp),allStars:0,mvps:0,titles:0}}
   })
 })
}

function fullSimRestOfGame(){

 const remainingGameSeconds=Math.max(0,(4-g.quarter)*720+g.clock);

   const pace=remainingMinutes/Math.max(1,g.targetMinutes||22);
   g.stats.pts+=Math.max(0,Math.round(((S.player.stats.ppg||ovr()/3)*pace)*(0.75+Math.random()*.5)));
   g.stats.ast+=Math.max(0,Math.round(((S.player.stats.apg||S.player.attrs.Playmaking/18)*pace)*(0.75+Math.random()*.5)));
   g.stats.reb+=Math.max(0,Math.round(((S.player.stats.rpg||S.player.attrs.Athleticism/22)*pace)*(0.75+Math.random()*.5)));
   g.minutesPlayed=Math.min(g.targetMinutes||40,(g.minutesPlayed||0)+remainingMinutes);

function clutchBadgeBoost(type){
 let names=[];
 if(type==="three")names=["Clutch Shooter","Deadeye","Limitless Range","Catch & Shoot","Killer Instinct","Ice in Veins","Big Game Player"];
 else if(type==="iso")names=["Quick First Step","Posterizer","Fearless Finisher","Slithery Finisher","Killer Instinct","Ice in Veins"];
 else if(type==="pnr")names=["Dimer","Needle Threader","Floor General","Ice in Veins"];
 else names=["Floor General","Dimer","Needle Threader","Big Game Player"];
 return names.reduce((sum,n)=>sum+badgeRank(n)*2.5,0)
}
function defensiveClutchBoost(){return ["Clamps","Challenger","Interceptor","Anchor","Glove","Big Game Player"].reduce((sum,n)=>sum+badgeRank(n)*2,0)}
function clutchResponseChance(type){

}

function resolveMoment(t){

   if(t==="three"){g.team+=3;g.pts+=3}
   else if(t==="pnr"){g.team+=2;g.ast++}
   else {g.team+=2;if(t==="iso")g.pts+=2;if(t==="team")S.player.trust=Math.min(100,S.player.trust+2)}
 }else{
   g.lastMessage="The defense wins the possession.";
   finishGame();return
 }
 const opponentScores=Math.random()*100<opponentAnswerChance();
 if(opponentScores){
   const three=Math.random()<.28,pts=three?3:2;g.oppScore+=pts;
   const chance=clutchResponseChance(t),underCap=g.clutchPossessions<MAX_CLUTCH_POSSESSIONS;
   const canRespond=underCap&&Math.random()*100<chance;
   g.lastMessage="They answered with "+pts+".";

     g.lastMessage="Final clutch exchange complete.";
     finishGame();return
   }else if(canRespond){
     showClutchResult("They answered back","You executed, but "+g.opp+" scored again. You have "+(MAX_CLUTCH_POSSESSIONS-g.clutchPossessions)+" clutch chance"+((MAX_CLUTCH_POSSESSIONS-g.clutchPossessions)===1?"":"s")+" left. Response chance: "+chance+"%. You earned another possession.",true)
   }else{
     g.lastMessage="Opponent answered and no extra response was earned.";
     finishGame();return
   }
 }else{
   g.lastMessage="Your defense gets the stop.";
   if(g.team>g.oppScore){
     g.win=true;
     const finalScore=g.team+"-"+g.oppScore;
     S.news.unshift("Clutch win: "+S.player.name+" delivered and the defense got the stop • "+finalScore+".");
     S.live=null;
     recordGame(g);
     toast("CLUTCH WIN • "+finalScore);
     return
   }
   finishGame();return
 }
}
function normalizeFinalScore(g){

 const nba=g.stage==="NBA"||S.stage==="NBA";
 if(!nba){g.scoreNormalized=true;return g}
 const playoff=!!g.playoff,originalDiff=Math.abs((g.team||0)-(g.oppScore||0));
 let winnerTarget=(playoff?104:110)+Math.floor(Math.random()*(playoff?20:21));
 winnerTarget=Math.max(winnerTarget,(g.pts||0)+42);
 winnerTarget=Math.min(145,winnerTarget);
 let margin=Math.max(1,Math.min(28,originalDiff||1));
 if(originalDiff>28)margin=28+Math.floor(Math.random()*7);
 const loserTarget=Math.max(playoff?92:96,winnerTarget-margin);
 if(g.win===undefined)g.win=(g.team||0)>(g.oppScore||0);
 if(g.win){g.team=winnerTarget;g.oppScore=loserTarget}else{g.oppScore=winnerTarget;g.team=loserTarget}
 g.scoreNormalized=true;return g
}

}
function recordGame(g){normalizeFinalScore(g);if(S.stage==="NBA"){coolLoadManagementScrutiny();const js=ensureTeamJerseyState();js.games++;updateJerseyUnlocks()}const gameNo=S.game||1,oppId=opponentTeamIdFromName(g.opp)||S.playoffs?.opponentId||null;S.games.unshift(g);const isPlayoff=!!(S.playoffs&&S.playoffs.active&&S.stage==="NBA");updateRecords(g,isPlayoff);if(!isPlayoff){S.record[g.win?"w":"l"]++;S.game++}const st=S.player.stats,old=st.gp;st.gp++;const ckey=S.stage==="NBA"?"nba":S.stage==="College"?"college":"highSchool";S.careerStats=S.careerStats||{highSchool:{gp:0,pts:0,ast:0,reb:0},college:{gp:0,pts:0,ast:0,reb:0},nba:{gp:0,pts:0,ast:0,reb:0}};const cst=S.careerStats[ckey];cst.gp++;cst.pts+=g.pts;cst.ast+=g.ast;cst.reb+=g.reb;st.ppg=(st.ppg*old+g.pts)/st.gp;st.apg=(st.apg*old+g.ast)/st.gp;st.rpg=(st.rpg*old+g.reb)/st.gp;S.player.energy=Math.max(35,S.player.energy-10);S.player.xp+=90+g.pts*3+g.ast*4+g.reb*2;if(S.stage!=="NBA")S.player.draft=Math.min(99,S.player.draft+(g.pts>=22?3:g.pts>=15?1:0));if(S.stage==="NBA"){S.player.trust=Math.min(100,S.player.trust+coachTrustGain(g)+pathBonus("coachTrust"));updateTeammateRelationships(g);updateCaptaincy();if(oppId)addRivalryHeat(oppId,(isPlayoff?8:0)+(g.pts>=30?3:1)+(Math.abs((g.team||0)-(g.oppScore||0))<=5?3:0));if(g.pts>=30)addCareerPathXP("superstar",g.pts>=40?10:6);if(g.win&&g.pts>=25)addCareerPathXP("superstar",3);if(g.ast>=8)addCareerPathXP("dynasty",2);if((S.year||1)>=5)addCareerPathXP("veteran",2);S.player.chemistry=Math.max(20,Math.min(100,S.player.chemistry+(g.win?2:-1)+(g.ast>=6?1:0)));updateRole()}else if(g.win)S.player.trust=Math.min(100,S.player.trust+1);if(g.win)S.player.morale=Math.min(100,S.player.morale+3);else S.player.morale=Math.max(20,S.player.morale-2);while(S.player.xp>=S.player.level*220){S.player.xp-=S.player.level*220;S.player.level++;S.player.attrs.IQ=Math.min(99,S.player.attrs.IQ+1);S.player.attrs.Athleticism=Math.min(99,S.player.attrs.Athleticism+1)}if([2,4,6,8,10,12].includes(st.gp)&&S.offers.length<COLLEGES.length&&!S.college){const pool=COLLEGES.filter(c=>!S.offers.includes(c));S.offers.push(pool[Math.floor(Math.random()*pool.length)])}if(S.stage==="NBA"&&!isPlayoff)maybeTriggerAllStarBreak();if(isPlayoff){if(g.win&&g.pts>=25&&Math.abs(g.team-g.oppScore)<=5)S.nbaWorld.records.playoff.clutchWins=(S.nbaWorld.records.playoff.clutchWins||0)+1;if(S.playoffs.playIn){finishPlayInGame(g)}else{const seriesKey=g.win?"seriesWins":"seriesLosses";S.playoffs[seriesKey]=Math.min(4,(S.playoffs[seriesKey]||0)+1);S.news.unshift((g.win?"Playoff win":"Playoff loss")+" vs "+g.opp+" • Series "+S.playoffs.seriesWins+"-"+S.playoffs.seriesLosses);advancePlayoffRound()}}else{S.news.unshift((g.win?"Win":"Loss")+" vs "+g.opp+": "+g.pts+" PTS, "+g.ast+" AST, "+g.reb+" REB.");if(S.stage==="NBA"){simulateOtherTeamsOneGame();ensureLeagueStandings();S.leagueStandings[S.team]={w:S.record.w,l:S.record.l};if(g.pts>=30)pushLeagueNews(S.player.name+" scored "+g.pts+" in "+currentTeamName()+"'s "+(g.win?"win":"loss")+".");updateCup(g,gameNo);maybeCreateLockerEvent();maybeInjury()}}S.training=S.training||{used:0,max:3,recovered:false};resetTrainingCycle();S.social=S.social||{followers:100,fame:0,posted:false,posts:0};S.social.posted=false;processRelationshipAfterGame(g);let payout=0;payout+=sponsorIncome();if((g.stage==="NBA"||S.stage==="NBA")&&S.finance.contract)payout+=S.finance.contract.perGame||0;payout+=passiveIncome();if(payout>0){S.finance.cash+=payout;S.finance.earnings+=payout;S.news.unshift("Off-court earnings paid $"+Math.round(payout).toLocaleString()+" after the game.")}if(S.stage==="NBA"&&!isPlayoff&&(S.record.w+S.record.l)>=82)startPlayoffs();save();render();toast(isPlayoff?"Playoff game complete":"Game complete — progress saved")}
function rest(){
 S.training=S.training||{used:0,max:baseTrainingSessions(),recovered:false,recoveryUsed:0,recoveryMax:baseRecoveryUses()};
 refreshConnectionBenefits();
 if((S.training.recoveryUsed||0)>=S.training.recoveryMax){toast("All recovery days used — play a game to reset");return}
 S.training.recoveryUsed=(S.training.recoveryUsed||0)+1;S.training.recovered=S.training.recoveryUsed>=S.training.recoveryMax;
 S.player.energy=100;S.player.morale=Math.min(100,S.player.morale+2);S.training.max+=recoveryTrainingBonus();
 save();render();toast("Recovered • +"+recoveryTrainingBonus()+" training sessions • "+Math.max(0,S.training.recoveryMax-S.training.recoveryUsed)+" recovery day(s) left")
}
function declareDraft(){if(S.stage!=="College"||(S.game-1)<8||S.player.draft<55){toast("Not draft eligible yet");return}S.careerHistory=S.careerHistory||{highSchool:null,collegeSeasons:[]};S.careerHistory.collegeSeasons=S.careerHistory.collegeSeasons||[];S.careerHistory.collegeSeasons.push({school:S.college,year:S.year,record:{w:S.record.w,l:S.record.l},games:S.game-1,stats:{...S.player.stats},level:S.player.level,ovr:ovr(),draft:S.player.draft});S.stage="Draft Combine";S.draftProcess={declared:true,combineDone:false,events:{shooting:false,agility:false,scrimmage:false},boost:0,pick:null};S.live=null;S.news.unshift("You declared for the NBA Draft. Next stop: NBA Draft Combine.");resetTrainingCycle();save();setScreen("career");toast("NBA Draft Combine unlocked")}
function collegeModal(){if(S.college){toast("Already committed to "+S.college);return}if(!S.offers.length){toast("You need a scholarship offer first");return}modal('<h2>Choose College</h2><p class="muted">This is a one-time commitment. Your player level, XP, attributes, badges, draft stock, and career game history will carry into college.</p><div class="list">'+S.offers.map(c=>'<button class="btn" data-college="'+c+'">'+c+'</button>').join("")+'</div><div class="modalFoot"><button class="btn" id="ccancel">Cancel</button></div>');document.querySelectorAll("[data-college]").forEach(b=>b.onclick=()=>{if(S.college){toast("College already selected");closeModal();return}const school=b.dataset.college;S.careerHistory=S.careerHistory||{highSchool:null,collegeSeasons:[]};S.careerHistory.highSchool={record:{w:S.record.w,l:S.record.l},games:S.game-1,stats:{...S.player.stats},level:S.player.level,ovr:ovr(),draft:S.player.draft};S.college=school;S.stage="College";S.year=1;S.record={w:0,l:0};S.game=1;resetSeasonStatLine();S.live=null;S.news.unshift("Committed to "+S.college+". Your high-school career is saved and your college season begins.");save();closeModal();setScreen("home");toast("Committed to "+S.college)});$("ccancel").onclick=closeModal}
window.addEventListener("pagehide",()=>{if(S&&S.created)save()});window.addEventListener("error",e=>{console.error("MYCAREER error",e.error||e.message);const content=$("content");if(content&&!content.innerHTML.trim())content.innerHTML='<section class="card s12"><h3>MYCAREER recovered from an error</h3><p class="muted">Tap New Career again. Your save has not been deleted.</p><button class="btn primary" id="recoverBtn">Return Home</button></section>';const r=$("recoverBtn");if(r)r.onclick=()=>{S.screen="home";render()}});$("profileBtn").onclick=()=>frontMode==="career"&&S.created?openAppearance():null;$("modalWrap").onclick=e=>{if(e.target===$("modalWrap"))closeModal()};render();
