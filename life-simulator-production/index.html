.avatar .hair{transform:translateX(-50%);transform-origin:50% 0}

/* short cuts sit directly on the scalp instead of inside the forehead */
.avatar .hair.fade{top:19.3%;width:49.5%;height:12.2%;clip-path:ellipse(50% 60% at 50% 58%)}

.avatar .hair.buzz{top:19.8%;width:48.5%;height:10.3%;clip-path:ellipse(50% 61% at 50% 58%)}

/* volume styles overlap the crown naturally but terminate at the forehead */
.avatar .hair.curls{top:10.8%;width:56%;height:24.8%}
.avatar .hair.afro{top:5.5%;width:64%;height:35.5%}

/* strand styles use a shared ~20.5% scalp anchor */

.avatar .hair.long:before{top:19.5%;height:27%;z-index:2}

const UI_ICON_PATHS={

};
function uiIcon(name){return '<svg class="uiIcon" viewBox="0 0 24 24" aria-hidden="true">'+(UI_ICON_PATHS[name]||UI_ICON_PATHS.star)+'</svg>'}
const HS_TEAMS=["Westfield Prep","Central Academy","North Ridge","Eastview","Bay State Tech","Riverside Prep","Metro Catholic","Pioneer High"];
const COLLEGES=["UConn","Duke","Kentucky","Kansas","Michigan State","Villanova","Arizona","North Carolina"];
const COLLEGE_TOURNAMENT_FIELD=["UConn","Duke","Kentucky","Kansas","Michigan State","Villanova","Arizona","North Carolina","Gonzaga","Houston","Tennessee","Purdue","Baylor","Alabama","Marquette","Creighton"];
const COLLEGE_TOURNAMENT_ROUNDS=["Round of 16","Quarterfinal","Semifinal","National Championship"];
function ensureCollegeTournamentState(){
 S.collegeTournament=S.collegeTournament||{active:false,completed:false,champion:false,eliminated:false,round:0,gameNumber:1,seed:null,opponent:null,history:[],field:[],regularSeasonGames:40};
 if(!Array.isArray(S.collegeTournament.history))S.collegeTournament.history=[];
 if(!Array.isArray(S.collegeTournament.field))S.collegeTournament.field=[];
 if(!Number.isFinite(S.collegeTournament.round))S.collegeTournament.round=Math.max(0,Math.min(3,S.collegeTournament.history.length));
 S.collegeTournament.round=Math.max(0,Math.min(3,S.collegeTournament.round));
 S.collegeTournament.gameNumber=Math.max(1,Math.min(4,S.collegeTournament.round+1));
 return S.collegeTournament
}
function collegeRegularSeasonGames(){
 return (S.games||[]).filter(g=>(g.stage==="College")&&!g.collegeTournament).length
}
function collegeTournamentActive(){const t=ensureCollegeTournamentState();return S.stage==="College"&&t.active&&!t.completed}
function collegeTournamentRoundName(){const t=ensureCollegeTournamentState();return COLLEGE_TOURNAMENT_ROUNDS[t.round]||"College Tournament"}
function collegeTournamentGameNumber(){const t=ensureCollegeTournamentState();return Math.max(1,Math.min(4,t.round+1))}
function collegeTournamentStageLabel(){return "Tournament Game "+collegeTournamentGameNumber()+" of 4 • "+collegeTournamentRoundName()}
function collegeTournamentGameBannerHTML(source){
 const active=source&&source.collegeTournament;
 if(!active)return "";
 const round=Number.isFinite(source.collegeTournamentRound)?source.collegeTournamentRound:ensureCollegeTournamentState().round;
 const game=Math.max(1,Math.min(4,round+1)),name=COLLEGE_TOURNAMENT_ROUNDS[round]||"College Tournament";
 return '<section class="card s12" style="border-color:#ff8d3f"><div class="row"><div><span class="kicker">NATIONAL COLLEGE TOURNAMENT</span><h2 style="margin:5px 0">Tournament Game '+game+' of 4 • '+name+'</h2></div><span class="pill good">WIN OR GO HOME</span></div><p class="muted" style="margin-bottom:0">'+S.college+' vs '+(source.opp||collegeTournamentNextOpponent())+' • #'+ensureCollegeTournamentState().seed+' Seed</p></section>'
}
function collegeTournamentSeed(){
 const winPct=(S.record.w||0)/Math.max(1,(S.record.w||0)+(S.record.l||0));
 const score=winPct*55+Math.min(30,(S.player.draft||0)*.3)+Math.min(15,ovr()*.15);
 return Math.max(1,Math.min(16,17-Math.round(score/100*15)))
}
function initializeCollegeTournament(){
 const t=ensureCollegeTournamentState();if(S.stage!=="College"||t.active||t.completed||collegeRegularSeasonGames()<40)return false;
 t.active=true;t.completed=false;t.champion=false;t.eliminated=false;t.round=0;t.gameNumber=1;t.seed=collegeTournamentSeed();
 const pool=COLLEGE_TOURNAMENT_FIELD.filter(x=>x!==S.college);
 while(pool.length<15)pool.push("National University "+(pool.length+1));
 t.field=[S.college,...pool.slice(0,15)];
 const oppSeed=17-t.seed;
 t.opponent=pool[(oppSeed-1)%pool.length]||pool[0];
 S.news.unshift("COLLEGE POSTSEASON • "+S.college+" earned the #"+t.seed+" seed. The 16-team National College Tournament is live.");
 addCareerTimeline("College Tournament","Earned the #"+t.seed+" seed after 40 college games","POSTSEASON");
 return true
}
function collegeTournamentNextOpponent(){
 const t=ensureCollegeTournamentState();if(!collegeTournamentActive())return null;
 if(t.opponent)return t.opponent;
 const used=new Set([S.college,...t.history.map(x=>x.opponent)]);
 const pool=COLLEGE_TOURNAMENT_FIELD.filter(x=>!used.has(x));
 t.opponent=pool[(t.round*3+(t.seed||1))%Math.max(1,pool.length)]||"National Contender";
 return t.opponent
}
function collegeTournamentAudience(round){
 return [1800000+Math.random()*1600000,3800000+Math.random()*2600000,7200000+Math.random()*4800000,13500000+Math.random()*9000000][round]||2200000
}
function processCollegeTournamentGame(g){
 const t=ensureCollegeTournamentState();if(!g.collegeTournament||!t.active||t.completed)return;
 const roundName=COLLEGE_TOURNAMENT_ROUNDS[t.round]||"Tournament";
 t.history.push({round:t.round,gameNumber:t.round+1,roundName,opponent:g.opp,win:!!g.win,score:(g.team||0)+"-"+(g.oppScore||0),pts:g.pts||0,ast:g.ast||0,reb:g.reb||0});
 if(!g.win){
   t.active=false;t.completed=true;t.eliminated=true;t.opponent=null;
   S.player.draft=Math.min(99,(S.player.draft||0)+2);
   S.news.unshift("COLLEGE POSTSEASON • Eliminated in the "+roundName+". Your tournament run is over; NBA Draft declaration is now available.");
   addCareerTimeline("Tournament Run Ended","Eliminated in the "+roundName,"POSTSEASON");
   return
 }
 const bonus=[3,4,6,10][t.round]||3;S.player.draft=Math.min(99,(S.player.draft||0)+bonus);
 S.social.fame=Math.min(100,(S.social.fame||0)+(t.round>=2?2:1));
 if(t.round>=3){
   t.active=false;t.completed=true;t.champion=true;t.opponent=null;
   S.accolades=S.accolades||[];if(!S.accolades.includes("National College Champion"))S.accolades.push("National College Champion");
   S.news.unshift("NATIONAL CHAMPIONS • "+S.college+" won the College Tournament! Draft Stock +"+bonus+".");
   addCareerTimeline("National College Champion",S.college+" completed the tournament run and won the title","CHAMPIONSHIP");
   return
 }
 t.round++;t.gameNumber=t.round+1;
 const used=new Set([S.college,...t.history.map(x=>x.opponent)]);
 const pool=COLLEGE_TOURNAMENT_FIELD.filter(x=>!used.has(x));
 t.opponent=pool[(t.round*4+(t.seed||1))%Math.max(1,pool.length)]||"National Contender";
 S.news.unshift("COLLEGE POSTSEASON • Advanced to the "+COLLEGE_TOURNAMENT_ROUNDS[t.round]+" vs "+t.opponent+". Draft Stock +"+bonus+".")
}
function collegeTournamentHTML(){
 if(S.stage!=="College")return "";
 const t=ensureCollegeTournamentState(),regular=collegeRegularSeasonGames();
 if(!t.active&&!t.completed)return '<section class="card s12"><div class="row"><div><span class="kicker">COLLEGE POSTSEASON</span><h3 style="margin:5px 0">National College Tournament</h3></div><span class="pill">'+Math.min(40,regular)+'/40 GAMES</span></div><p class="muted">After 40 college games, a 16-team single-elimination tournament begins. Four wins earns the national championship.</p>'+meter("Regular Season",Math.min(100,regular/40*100))+'</section>';
 const status=t.champion?"NATIONAL CHAMPION":t.eliminated?"ELIMINATED":collegeTournamentRoundName().toUpperCase();
 const history=t.history.map(x=>'<div class="item"><div><b>Tournament Game '+(x.gameNumber||x.round+1)+' of 4 • '+x.roundName+' • '+x.opponent+'</b><small>'+x.pts+' PTS • '+x.ast+' AST • '+x.reb+' REB</small></div><span class="pill '+(x.win?"good":"bad")+'">'+(x.win?"W ":"L ")+x.score+'</span></div>').join("");
 return '<section class="card s12"><div class="row"><div><span class="kicker">16-TEAM COLLEGE POSTSEASON</span><h2 style="margin:5px 0">National College Tournament</h2><small class="muted">'+S.college+' • #'+t.seed+' Seed</small></div><span class="pill '+(t.champion?"good":t.eliminated?"bad":"")+'">'+status+'</span></div>'+(t.active?'<div class="item" style="margin-top:12px;border-color:#ff8d3f"><div><b>'+collegeTournamentStageLabel()+'</b><small>Next: '+collegeTournamentNextOpponent()+' • Single elimination • '+Math.max(0,4-t.history.length)+' win'+(Math.max(0,4-t.history.length)===1?'':'s')+' from the title</small></div><span class="pill good">GAME '+collegeTournamentGameNumber()+'/4</span></div>':'')+'<div class="list" style="margin-top:12px">'+(history||'<div class="item"><small>Bracket begins with your first postseason game.</small></div>')+'</div></section>'
}

function collegePostseasonCompleteHTML(){
 const t=ensureCollegeTournamentState();if(S.stage!=="College"||!t.completed)return "";
 const d=calculateDraftProjection(),awards=ensureDraftProjectionState().collegeAwards||[],eligible=(S.player.draft||0)>=55;
 return '<div class="grid" style="margin-top:0"><section class="card s12" style="border-color:'+(t.champion?'#2ca86f':'#ff8d3f')+'"><span class="kicker">COLLEGE CAREER COMPLETE</span><h1 style="margin:6px 0">'+(t.champion?'NATIONAL CHAMPIONS!':'POSTSEASON COMPLETE')+'</h1><p class="muted">'+(t.champion?S.college+' finished the run by winning the National College Tournament. Your college résumé is locked in and NBA Draft preparation is next.':'Your tournament run is over. Your college résumé is complete and NBA Draft preparation is next.')+'</p><div class="grid" style="margin-top:12px"><div class="card" style="grid-column:span 4"><small class="muted">TOURNAMENT RESULT</small><div class="big" style="font-size:22px">'+(t.champion?'CHAMPION':'ELIMINATED')+'</div></div><div class="card" style="grid-column:span 4"><small class="muted">DRAFT PROJECTION</small><div class="big" style="font-size:22px">#'+d.min+'-'+d.max+'</div></div><div class="card" style="grid-column:span 4"><small class="muted">COLLEGE ACCOLADES</small><div class="big" style="font-size:22px">'+awards.length+'</div></div></div><div class="actions" style="margin-top:14px">'+(eligible?'<button class="btn primary" id="collegeDeclareDraftBtn">Declare for NBA Draft</button>':'<button class="btn" data-go="career">View Draft Board</button>')+'<button class="btn" data-go="career">College Résumé & Draft Board</button></div>'+(eligible?'':'<p class="muted" style="margin-top:10px">You need 55 Draft Stock to declare. Open Career to review your projection and remaining path.</p>')+'</section>'+collegeTournamentHTML()+draftProjectionHTML()+'</div>'
}
function showCollegePostseasonComplete(g){
 const t=ensureCollegeTournamentState();if(!t.completed)return;
 evaluateCollegeAwards();updateDraftProjectionHistory(t.champion?"National Championship":"Tournament Run Complete");
 const d=calculateDraftProjection(),awards=ensureDraftProjectionState().collegeAwards||[],eligible=(S.player.draft||0)>=55;
 modal('<div class="row"><div><span class="kicker">COLLEGE CAREER COMPLETE</span><h2 style="margin:5px 0">'+(t.champion?'🏆 NATIONAL CHAMPIONS!':'Tournament Run Complete')+'</h2></div><span class="pill '+(t.champion?'good':'bad')+'">'+(t.champion?'CHAMPION':'ELIMINATED')+'</span></div><p class="muted">'+(t.champion?'You won the National College Tournament. Your college career is complete and your NBA Draft journey is ready to continue.':'Your college postseason is over. Your NBA Draft journey is ready to continue.')+'</p><div class="row"><span>Final Draft Projection</span><strong>#'+d.min+'-'+d.max+' • '+draftProjectionTier(d.min,d.max)+'</strong></div><div class="row"><span>College Accolades</span><strong>'+awards.length+'</strong></div><div class="row"><span>Draft Stock</span><strong>'+S.player.draft+'</strong></div><div class="modalFoot">'+(eligible?'<button class="btn primary" id="postCollegeDeclareBtn">Declare for NBA Draft</button>':'')+'<button class="btn" id="postCollegeCareerBtn">View Draft Board</button></div>');
 if($("postCollegeDeclareBtn"))$("postCollegeDeclareBtn").onclick=()=>{closeModal();declareDraft()};
 if($("postCollegeCareerBtn"))$("postCollegeCareerBtn").onclick=()=>{closeModal();setScreen("career")}
}

const COLLEGE_AWARD_WEIGHTS={
 "National College Champion":18,"Tournament Most Outstanding Player":13,"National Player of the Year":15,
 "First Team All-College":10,"Second Team All-College":7,"Third Team All-College":5,
 "College Scoring Champion":8,"College Assist Leader":8,"College Rebound Leader":8,
 "College Defensive Player of the Year":9,"All-Tournament Team":7
};
function ensureDraftProjectionState(){
 S.draftProjection=S.draftProjection||{history:[],collegeAwards:[],score:0,min:31,max:45,consensus:38,reasons:[],lastGame:0,lastStage:""};
 if(!Array.isArray(S.draftProjection.history))S.draftProjection.history=[];
 if(!Array.isArray(S.draftProjection.collegeAwards))S.draftProjection.collegeAwards=[];
 if(!Array.isArray(S.draftProjection.reasons))S.draftProjection.reasons=[];
 return S.draftProjection
}
function addCollegeAward(name){
 const d=ensureDraftProjectionState();if(d.collegeAwards.includes(name))return false;
 d.collegeAwards.push(name);S.accolades=S.accolades||[];if(!S.accolades.includes(name))S.accolades.push(name);
 S.news.unshift("COLLEGE AWARD • "+name+" added to your draft résumé.");return true
}
function evaluateCollegeAwards(){
 if(!S.college)return;
 const d=ensureDraftProjectionState(),st=S.player.stats||{},t=ensureCollegeTournamentState(),reg=collegeRegularSeasonGames();
 if(reg>=20){
   if(st.ppg>=24)addCollegeAward("Third Team All-College");
   if(st.ppg>=27||st.apg>=8||st.rpg>=11)addCollegeAward("Second Team All-College");
 }
 if(reg>=40){
   if(st.ppg>=30||st.apg>=10||st.rpg>=13)addCollegeAward("First Team All-College");
   if(st.ppg>=31)addCollegeAward("College Scoring Champion");
   if(st.apg>=10)addCollegeAward("College Assist Leader");
   if(st.rpg>=13)addCollegeAward("College Rebound Leader");
   const adv=ensurePolishState().seasonAdvanced||{},gp=Math.max(1,adv.gp||st.gp||1);
   if(((adv.stl||0)+(adv.blk||0))/gp>=3.2)addCollegeAward("College Defensive Player of the Year");
   if((st.ppg>=31&&S.record.w>=28)||(st.ppg>=27&&st.apg>=8&&S.record.w>=30))addCollegeAward("National Player of the Year");
 }
 if(t.history&&t.history.length>=2){
   const avg=t.history.reduce((s,x)=>s+(x.pts||0)+(x.ast||0)*1.5+(x.reb||0),0)/t.history.length;
   if(avg>=32)addCollegeAward("All-Tournament Team");
 }
 if(t.champion){
   addCollegeAward("National College Champion");
   const avg=t.history.length?t.history.reduce((s,x)=>s+(x.pts||0)+(x.ast||0)*1.5+(x.reb||0),0)/t.history.length:0;
   if(avg>=34)addCollegeAward("Tournament Most Outstanding Player");
 }
 d.collegeAwards=[...new Set(d.collegeAwards)]
}
function draftProjectionTier(min,max){
 if(max<=3)return "Top 3";
 if(max<=14)return min<=3?"Top 3 / Lottery":"Lottery";
 if(max<=22)return "Mid-First Round";
 if(max<=30)return "Late First Round";

function calculateDraftProjection(){
 const d=ensureDraftProjectionState();evaluateCollegeAwards();
 const st=S.player.stats||{},t=ensureCollegeTournamentState(),gp=Math.max(1,st.gp||0),wins=S.record?.w||0,losses=S.record?.l||0,winPct=wins/Math.max(1,wins+losses);
 let score=18;
 const reasons=[];
 d.collegeAwards.forEach(a=>{const w=COLLEGE_AWARD_WEIGHTS[a]||4;score+=w;reasons.push("+"+a)});
 score+=Math.min(16,Math.max(0,(st.ppg-14)*.75));
 score+=Math.min(10,Math.max(0,(st.apg-3)*1.1));
 score+=Math.min(9,Math.max(0,(st.rpg-4)*.85));
 score+=winPct*12;
 score+=Math.max(0,(ovr()-70)*.22);
 score+=Math.max(0,((S.player.draft||50)-50)*.12);
 if(t.history?.length){score+=t.history.filter(x=>x.win).length*3;if(t.champion)score+=6}
 if(st.ppg>=25)reasons.push("+"+st.ppg.toFixed(1)+" PPG college production");
 if(st.apg>=7)reasons.push("+"+st.apg.toFixed(1)+" APG playmaking");
 if(st.rpg>=10)reasons.push("+"+st.rpg.toFixed(1)+" RPG impact");
 if(winPct>=.7)reasons.push("+"+Math.round(winPct*100)+"% team win rate");
 const adv=ensurePolishState().seasonAdvanced||{};
 if((adv.tov||0)/Math.max(1,adv.gp||gp)>=3.4){score-=5;reasons.push("- Turnovers remain a scouting concern")}
 if(st.ppg<16&&gp>=12){score-=4;reasons.push("- Limited scoring production")}
 score=Math.max(0,Math.min(100,score));
 const center=Math.max(1,Math.min(60,61-Math.round(score*.59)));
 const spread=gp<10?8:gp<25?6:gp<40?4:t.completed?2:3;
 d.score=Math.round(score);d.consensus=center;d.min=Math.max(1,center-spread);d.max=Math.min(60,center+spread);d.reasons=reasons.slice(0,7);
 const offsets=[-2,1,3],names=["Hoops Draft Network","Pro Future Board","National Scout"];
 d.scouts=names.map((name,i)=>({name,pick:Math.max(1,Math.min(60,center+offsets[i]+((gp+i)%3-1)))}));
 return d
}
function updateDraftProjectionHistory(label){
 if(!S.college&&S.stage!=="Draft Combine")return;
 const d=calculateDraftProjection(),stamp=(S.stage||"College")+"-"+(S.game||0)+"-"+label;
 if(d.history[0]?.stamp===stamp)return;
 const prev=d.history[0],move=prev?prev.consensus-d.consensus:0;
 d.history.unshift({stamp,label:label||"Scouting Update",game:S.game||0,stage:S.stage,min:d.min,max:d.max,consensus:d.consensus,tier:draftProjectionTier(d.min,d.max),move,score:d.score});
 d.history=d.history.slice(0,30)
}
function draftProjectionHTML(){
 if(!S.college&&S.stage!=="Draft Combine")return "";
 const d=calculateDraftProjection(),hist=d.history||[],move=hist[0]?.move||0;
 const moveText=move>0?"▲ Up "+move+" spot"+(move===1?"":"s"):move<0?"▼ Down "+Math.abs(move)+" spot"+(move===-1?"":"s"):"• Holding steady";
 const awards=d.collegeAwards.length?d.collegeAwards.map(a=>'<span class="pill good">'+a+'</span>').join(" "):'<span class="muted">No major college awards yet.</span>';
 const scouts=(d.scouts||[]).map(x=>'<div class="row"><span>'+x.name+'</span><strong>#'+x.pick+'</strong></div>').join("");
 const reasons=(d.reasons||[]).map(x=>'<div class="item"><small>'+x+'</small></div>').join("");
 const history=hist.slice(0,8).map(x=>'<div class="row"><span>'+x.label+'</span><strong>#'+x.min+'-'+x.max+(x.move?" • "+(x.move>0?"▲":"▼")+Math.abs(x.move):"")+'</strong></div>').join("");
 return '<section class="card s12" style="border-color:#6f7dff"><div class="row"><div><span class="kicker">LIVE DRAFT BOARD</span><h2 style="margin:5px 0">Projected Pick #'+d.min+'-'+d.max+'</h2><small class="muted">'+draftProjectionTier(d.min,d.max)+' • Résumé Score '+d.score+'/100</small></div><span class="pill '+(move>0?"good":move<0?"bad":"")+'">'+moveText+'</span></div><div class="grid" style="margin-top:12px"><div class="card" style="grid-column:span 4"><h3>Scout Consensus</h3>'+scouts+'</div><div class="card" style="grid-column:span 8"><h3>Why Scouts Have You Here</h3><div class="list">'+(reasons||'<div class="item"><small>Keep building your college résumé.</small></div>')+'</div></div></div><h3 style="margin-top:14px">College Résumé</h3><div style="display:flex;gap:6px;flex-wrap:wrap">'+awards+'</div><h3 style="margin-top:14px">Projection History</h3><div class="list">'+(history||'<div class="item"><small>Your board movement will appear after college games.</small></div>')+'</div></section>'
}

function baseGarageCapacity(){
 ensureWealthState();
 const owned=S.finance.realEstate||[];
 if(owned.includes("legacy_development"))return 12;
 if(owned.includes("private_compound"))return 10;
 if(owned.includes("lake_estate"))return 8;
 if(owned.includes("gated_mansion"))return 6;
 if(owned.includes("rental_tower"))return 4;
 if(owned.includes("skyline_penthouse"))return 3;
 return S.stage==="NBA"||S.stage==="Offseason"||S.stage==="Retired"?2:1
}
function garageCapacity(){
 const g=ensureGarageState(),base=baseGarageCapacity();
 return Math.min(16,base+(g.purchasedSlots||0))
}
function garageExpansionCost(){
 const g=ensureGarageState(),capacity=garageCapacity();
 if(capacity>=16)return 0;
 return 75000+Math.max(0,capacity-1)*50000
}
function purchaseGarageExpansion(){
 const g=ensureGarageState(),base=baseGarageCapacity(),capacity=garageCapacity();
 if(capacity>=16){toast("Garage already at the 16-car maximum");return}
 const cost=garageExpansionCost();
 if(!spendLiquid(cost)){toast("Not enough cash or bank funds for garage expansion");return}
 g.purchasedSlots=Math.max(0,(g.purchasedSlots||0)+1);
 const newCapacity=Math.min(16,base+g.purchasedSlots);
 S.news.unshift("Garage expanded to "+newCapacity+" vehicle spaces for "+compactMoney(cost)+".");
 if(S.stage==="NBA"||S.stage==="Offseason")addCareerPathXP("business",8);
 save();render();toast("Garage expanded to "+newCapacity+" spaces")
}
function ensureGarageState(){
 ensureWealthState();
 S.finance.garage=S.finance.garage||{owned:[],active:null,gameDay:null,showCar:null,custom:{},actionsUsed:0,actionCounts:{},nightCity:null,legacyCarMigrated:false,purchasedSlots:0};
 const g=S.finance.garage;
 if(!Array.isArray(g.owned))g.owned=[];
 if(!g.custom||typeof g.custom!=="object")g.custom={};if(g.gameDay&&!g.owned.includes(g.gameDay))g.gameDay=null;if(g.showCar&&!g.owned.includes(g.showCar))g.showCar=null;
 if(typeof g.actionsUsed!=="number")g.actionsUsed=0;if(typeof g.purchasedSlots!=="number"||g.purchasedSlots<0)g.purchasedSlots=0;g.purchasedSlots=Math.min(15,g.purchasedSlots);
 if(!g.actionCounts||typeof g.actionCounts!=="object")g.actionCounts={};
 if(!g.legacyCarMigrated&&S.finance.owned&&S.finance.owned.includes("car")){
   if(!g.owned.includes("metro_gt")){
     g.owned.push("metro_gt");g.custom.metro_gt={color:"midnight",package:"Stock",condition:100};
     if(!g.active)g.active="metro_gt"
   }
   g.legacyCarMigrated=true
 }
 g.owned=g.owned.filter((id,i,a)=>vehicleById(id)&&a.indexOf(id)===i);
 if(g.active&&!g.owned.includes(g.active))g.active=g.owned[0]||null;
 g.owned.forEach(id=>{if(!g.custom[id])g.custom[id]={color:"midnight",package:"Stock",condition:100};const c=g.custom[id];if(typeof c.condition!=="number")c.condition=100;if(!c.upgrades||typeof c.upgrades!=="object")c.upgrades={};if(!c.insurance)c.insurance="none";if(typeof c.mileage!=="number")c.mileage=0});if(!g.gameDay)g.gameDay=g.active||g.owned[0]||null;if(!g.showCar)g.showCar=g.active||g.owned[0]||null;
 return g
}

function vehicleValue(id){
 const v=vehicleById(id),g=ensureGarageState(),c=g.custom[id]||{},pkg=c.package==="Performance"?45000:c.package==="Luxury"?30000:c.package==="Blackout"?18000:0,upgradeSpend=Object.keys(c.upgrades||{}).reduce((s,k)=>s+(VEHICLE_UPGRADES[k]?.cost||0),0);

 return v?Math.round((v.price+pkg+upgradeSpend*.62)*.72*condition):0
}

const PHONE_POS_KEY="mycareer-phone-position-v1";
let phoneEditMode=false,phoneDragging=false,phoneDragMoved=false,phoneDragOffset={x:0,y:0};

function savedPhonePosition(){
 try{
   const p=JSON.parse(localStorage.getItem(PHONE_POS_KEY)||"null");
   return p&&Number.isFinite(p.x)&&Number.isFinite(p.y)?p:null
 }catch(e){return null}
}
function phoneSafePosition(x,y,el){
 const pad=8,w=el?.offsetWidth||70,h=el?.offsetHeight||70;
 const maxX=Math.max(pad,window.innerWidth-w-pad);
 const maxY=Math.max(pad,window.innerHeight-h-pad);
 return {x:Math.max(pad,Math.min(maxX,x)),y:Math.max(pad,Math.min(maxY,y))}
}
function defaultPhonePosition(el){
 const w=el?.offsetWidth||70,h=el?.offsetHeight||70;
 const dockGap=88+(window.visualViewport?Math.max(0,window.innerHeight-window.visualViewport.height):0);
 return phoneSafePosition((window.innerWidth-w)/2,window.innerHeight-h-dockGap,el)
}
function applyPhonePosition(){
 const fp=$("floatingPhoneBtn"),edit=$("phoneEditToggle");if(!fp)return;
 const saved=savedPhonePosition(),p=phoneSafePosition(saved?saved.x:defaultPhonePosition(fp).x,saved?saved.y:defaultPhonePosition(fp).y,fp);
 fp.classList.add("phoneCustomPosition");
 fp.style.setProperty("left",p.x+"px","important");
 fp.style.setProperty("top",p.y+"px","important");
 fp.style.setProperty("right","auto","important");
 fp.style.setProperty("bottom","auto","important");
 fp.style.setProperty("transform","none","important");
 if(saved&&(saved.x!==p.x||saved.y!==p.y))localStorage.setItem(PHONE_POS_KEY,JSON.stringify(p));
 if(edit){
   const ew=edit.offsetWidth||54,eh=edit.offsetHeight||30;
   const ex=Math.max(6,Math.min(window.innerWidth-ew-6,p.x+(fp.offsetWidth||70)-12));
   const ey=Math.max(6,Math.min(window.innerHeight-eh-6,p.y-eh-5));
   edit.style.left=ex+"px";edit.style.top=ey+"px";edit.style.right="auto";edit.style.bottom="auto"
 }
}
function phoneUsesTapPlacement(){return window.matchMedia&&window.matchMedia("(pointer: coarse)").matches}
function setPhoneEditMode(on){

 document.documentElement.classList.remove("phoneDraggingNow");
 document.body.classList.remove("phoneDraggingNow");
 const fp=$("floatingPhoneBtn"),edit=$("phoneEditToggle"),label=$("floatingPhoneLabel"),hint=$("phonePlaceHint"),shield=$("phonePlaceShield"),tapMode=phoneUsesTapPlacement();
 if(fp)fp.classList.toggle("phoneEditMode",phoneEditMode);

 if(label)label.textContent=phoneEditMode?(tapMode?"Tap Spot":"Drag Me"):"Phone";

 if(hint)hint.classList.toggle("hidden",!(phoneEditMode&&tapMode));

}
function bindPhoneDrag(){
 const fp=$("floatingPhoneBtn"),edit=$("phoneEditToggle");if(!fp||fp.dataset.dragBound==="1")return;
 fp.dataset.dragBound="1";
 fp.addEventListener("pointerdown",e=>{
   if(!phoneEditMode||phoneUsesTapPlacement())return;
   e.preventDefault();e.stopPropagation();
   phoneDragging=true;phoneDragMoved=false;
   document.documentElement.classList.add("phoneDraggingNow");
   document.body.classList.add("phoneDraggingNow");
   const r=fp.getBoundingClientRect();phoneDragOffset={x:e.clientX-r.left,y:e.clientY-r.top};
   try{fp.setPointerCapture(e.pointerId)}catch(_){}
 });
 fp.addEventListener("pointermove",e=>{
   if(!phoneDragging||!phoneEditMode)return;
   e.preventDefault();e.stopPropagation();phoneDragMoved=true;
   const p=phoneSafePosition(e.clientX-phoneDragOffset.x,e.clientY-phoneDragOffset.y,fp);
   fp.style.setProperty("left",p.x+"px","important");fp.style.setProperty("top",p.y+"px","important");
   if(edit){
     const ew=edit.offsetWidth||54,eh=edit.offsetHeight||30;
     edit.style.left=Math.max(6,Math.min(window.innerWidth-ew-6,p.x+fp.offsetWidth-12))+"px";
     edit.style.top=Math.max(6,Math.min(window.innerHeight-eh-6,p.y-eh-5))+"px"
   }
 });
 const finish=e=>{
   if(!phoneDragging)return;phoneDragging=false;
   document.documentElement.classList.remove("phoneDraggingNow");
   document.body.classList.remove("phoneDraggingNow");
   const r=fp.getBoundingClientRect(),p=phoneSafePosition(r.left,r.top,fp);
   localStorage.setItem(PHONE_POS_KEY,JSON.stringify(p));applyPhonePosition();
   try{fp.releasePointerCapture(e.pointerId)}catch(_){}
 };
 fp.addEventListener("pointerup",finish);fp.addEventListener("pointercancel",finish);
 fp.addEventListener("click",e=>{if(phoneEditMode||phoneDragMoved){e.preventDefault();e.stopPropagation();phoneDragMoved=false}});
 const shield=$("phonePlaceShield");
 if(shield&&!shield.dataset.bound){
   shield.dataset.bound="1";
   shield.addEventListener("pointerup",e=>{
     if(!phoneEditMode||!phoneUsesTapPlacement())return;
     e.preventDefault();e.stopPropagation();
     const fpNow=$("floatingPhoneBtn");if(!fpNow)return;
     const p=phoneSafePosition(e.clientX-fpNow.offsetWidth/2,e.clientY-fpNow.offsetHeight/2,fpNow);
     localStorage.setItem(PHONE_POS_KEY,JSON.stringify(p));
     applyPhonePosition();
     toast("Phone moved");
   },{passive:false});
   shield.addEventListener("click",e=>{if(phoneEditMode){e.preventDefault();e.stopPropagation()}},{capture:true});
 }
 if(edit){
   edit.onclick=e=>{e.preventDefault();e.stopPropagation();setPhoneEditMode(!phoneEditMode)};
   let hold=null;
   edit.addEventListener("pointerdown",()=>{hold=setTimeout(()=>{if(phoneEditMode)resetPhonePosition()},900)});
   ["pointerup","pointercancel","pointerleave"].forEach(ev=>edit.addEventListener(ev,()=>{if(hold){clearTimeout(hold);hold=null}}))
 }
}

function inferLegacyContractLedger(con){
 const year=Math.max(1,S.year||1),rookie=(con.type==="Rookie Contract"||(con.label||"").includes("Rookie")||!!(S.draftProcess&&S.draftProcess.pick));
 if(typeof con.startYear!=="number"){
   if(rookie)con.startYear=1;
   else{
     const used=Math.max(0,(con.years||0)-(con.yearsRemaining||con.years||0));
     con.startYear=Math.max(1,(S.stage==="Offseason"?year+1:year)-used)
   }
 }
 if(typeof con.lastProcessedOffseasonYear!=="number"){
   if(rookie){
     const completed=S.stage==="Offseason"?year:Math.max(0,year-1);
     const expected=Math.max(0,con.years-completed);
     if(con.yearsRemaining>expected)con.yearsRemaining=expected;
     con.lastProcessedOffseasonYear=completed
   }else{
     const used=Math.max(0,con.years-(con.yearsRemaining||0));

 if(!con.type)con.type=(con.label||"").includes("Rookie")?"Rookie Contract":(con.label||"").includes("Extension")?"Extension":"NBA Contract";

function makeRosterDepthPlayer(teamId,index,used){
 const pos=["PG","SG","SF","PF","C"][index%5],seed=teamId.split("").reduce((n,ch)=>n+ch.charCodeAt(0),0)*19+index*31;
 let name=DRAFT_FIRST_NAMES[seed%DRAFT_FIRST_NAMES.length]+" "+DRAFT_LAST_NAMES[(seed*3+index)%DRAFT_LAST_NAMES.length],tries=0;
 while(used.has(name)&&tries<200){tries++;name=DRAFT_FIRST_NAMES[(seed+tries*7)%DRAFT_FIRST_NAMES.length]+" "+DRAFT_LAST_NAMES[(seed*3+index+tries*11)%DRAFT_LAST_NAMES.length]}
 if(used.has(name))name=teamId.toUpperCase()+" Reserve "+(index+1);used.add(name);
 const ovr=Math.max(66,Math.min(79,68+((seed+index)%12))),age=21+((seed+index*3)%12),yearsPro=Math.max(0,age-20),potential=Math.min(88,ovr+(age<=24?5:2));
 const ppg=+(Math.max(4,ovr-62)*.55+(seed%15)/10).toFixed(1),apg=+(pos==="PG"?2.8+(seed%25)/10:pos==="SG"?1.8+(seed%18)/10:1+(seed%12)/10).toFixed(1),rpg=+(pos==="C"?4.5+(seed%30)/10:pos==="PF"?3.8+(seed%24)/10:2+(seed%18)/10).toFixed(1);
 const contractYears=1+((seed+index)%4),contractValue=Math.round(realisticAnnualSalary(ovr)*(0.9+(seed%21)/100)*contractYears),gp=yearsPro*74;
 return {id:"depth-"+teamId+"-"+index,name,pos,age,ovr,potential,personality:["Loyal","Competitive","Professional","Defensive-Minded","Team-First"][(seed+index)%5],ppg,apg,rpg,source:"depth",yearsPro,contractYears,contractValue,career:{gp,pts:Math.round(ppg*gp),ast:Math.round(apg*gp),reb:Math.round(rpg*gp),allStars:0,mvps:0,titles:0}}
}
function ensureLeagueRosters(){

 NBA_TEAMS.forEach(t=>{
   if(!Array.isArray(S.leagueRosters[t.id]))S.leagueRosters[t.id]=t.stars.map(p=>({...p,source:"veteran",yearsPro:5}));
   let roster=S.leagueRosters[t.id];roster.forEach(p=>used.add(p.name));while(roster.length<15)roster.push(makeRosterDepthPlayer(t.id,roster.length,used));
   roster.forEach((p,i)=>{if(typeof p.yearsPro!=="number")p.yearsPro=5;if(typeof p.age!=="number")p.age=24+p.yearsPro;if(typeof p.ovr!=="number")p.ovr=Math.max(68,Math.min(95,Math.round(66+(p.ppg||10)*.75)));if(typeof p.potential!=="number")p.potential=Math.min(96,p.ovr+(p.yearsPro<=5?6:2));if(!p.personality)p.personality=["Loyal","Competitive","Money-Focused","Ring Chaser","Laid Back","Leader"][(i+t.id.length)%6];if(typeof p.contractYears!=="number")p.contractYears=1+((i+t.id.length)%4);if(typeof p.contractValue!=="number")p.contractValue=Math.round(realisticAnnualSalary(p.ovr)*Math.max(1,p.contractYears||1));normalizeContractValue(p);if(!p.career){const gp=p.yearsPro*76;p.career={gp,pts:Math.round((p.ppg||0)*gp),ast:Math.round((p.apg||0)*gp),reb:Math.round((p.rpg||0)*gp),allStars:0,mvps:0,titles:0}}});
   roster.sort((x,y)=>(y.ovr||0)-(x.ovr||0)||(y.ppg||0)-(x.ppg||0));if(roster.length>15)S.leagueRosters[t.id]=roster.slice(0,15);rebalanceRosterPayroll(S.leagueRosters[t.id],t.id)
 })
}

 const annual=p=>Math.round((p.contractValue||0)/Math.max(1,p.contractYears||1));
 let total=roster.reduce((s,p)=>s+annual(p),0);
 if(total<=target)return;
 const ordered=[...roster].sort((a,b)=>(b.ovr||0)-(a.ovr||0));
 const protectedNames=new Set(ordered.slice(0,2).map(p=>p.name));
 for(let pass=0;pass<4&&total>target;pass++){
  const adjustable=roster.filter(p=>!protectedNames.has(p.name));
  const adjustableTotal=adjustable.reduce((s,p)=>s+annual(p),0);
  if(!adjustableTotal)break;
  const protectedTotal=total-adjustableTotal;
  const room=Math.max(0,target-protectedTotal);
  const scale=Math.max(.55,Math.min(1,room/adjustableTotal));
  adjustable.forEach(p=>{
   const yrs=Math.max(1,p.contractYears||1);
   const floor=Math.max(1200000,Math.round(realisticAnnualSalary(p.ovr)*.62));
   const next=Math.max(floor,Math.round(annual(p)*scale));

function allStarPerformance(win){
 const p=S.player;
 const pts=Math.max(8,Math.round(14+(p.attrs.Shooting+p.attrs.Finishing)/15+Math.random()*18));
 const ast=Math.max(1,Math.round((p.attrs.Playmaking+p.attrs.IQ)/24+Math.random()*7));

 const score=pts+ast*1.8+reb*1.2;

 if(pts>=20)bonus+=100000;if(pts>=30)bonus+=200000;if(ast>=8)bonus+=100000;if(reb>=8)bonus+=100000;
 if(win)bonus+=250000;if(mvp)bonus+=500000;

}

function loadManagementGameWeight(spot){
 if(!spot)return 1;
 let w=spot.tv==="Prime Time"?3:spot.tv==="National"?2:1;
 if(spot.title==="NBA Cup Final")w=Math.max(w,4);
 else if(spot.title==="NBA Cup"||spot.title==="Rivalry Night"||spot.title==="Revenge Game")w=Math.max(w,3);
 else if(spot.title==="Prime-Time Showcase")w=Math.max(w,3);
 return w
}
function loadManagementFineForScore(score,tier){

 return score>=14?table[Math.max(idx,5)]:score>=10?table[Math.max(idx,4)]:score>=7?table[Math.max(idx,3)]:score>=4?table[Math.max(idx,2)]:0
}
function evaluateLoadManagementDiscipline(spot){
 const lm=S.nbaWorld.loadManagement,weight=loadManagementGameWeight(spot),marquee=weight>=2;
 lm.rests=(lm.rests||0)+1;lm.cleanGames=0;lm.abuseScore=Math.min(20,(lm.abuseScore||0)+weight);
 if(marquee)lm.broadcastRests=(lm.broadcastRests||0)+1;

function fullGameFollowerGain(g,out){

function postgameQuestionFor(m){

 const pool=[];
 if(m.collegeTournament){
   const round=COLLEGE_TOURNAMENT_ROUNDS[m.collegeTournamentRound]||"College Tournament";
   if(m.win)pool.push("You survived the "+round+". What was the difference tonight?");
   else pool.push("Your tournament run just ended in the "+round+". What do you say to everyone who believed in this team?");
   if(m.collegeTournamentRound===3&&m.win)pool.push("You are a national champion now. What does this title mean to you?");
 }
 if(m.win&&close)pool.push("That game came down to the final possessions. What gave your team the edge?");
 if(!m.win&&close)pool.push("You were one possession away. What do you think decided this game?");
 if(m.pts>=30)pool.push("You scored "+m.pts+" tonight. Did you feel like anyone could stop you?");
 if(m.ast>=10)pool.push("You finished with "+m.ast+" assists. What were you seeing from the defense?");
 if(m.reb>=12)pool.push("You controlled the glass with "+m.reb+" rebounds. How important was your physicality tonight?");
 if((m.tov||0)>=4)pool.push("You had "+m.tov+" turnovers tonight. How do you clean that up next game?");
 if(m.stage==="College"&&!m.collegeTournament)pool.push("Another college game is in the books. What do you want scouts to take away from this performance?");
 if(m.stage==="NBA"&&m.playoff)pool.push("The pressure is different in the playoffs. How are you handling this moment?");
 if(m.stage==="NBA"&&!m.playoff)pool.push("What is the biggest thing your team can build on from tonight?");
 if(m.win)pool.push("What stood out most about the way your team got this win?");
 else pool.push("What has to change after this loss?");
 const idx=Math.abs((m.pts||0)*3+(m.ast||0)*5+(m.reb||0)*7+(m.gameNumber||0))%pool.length;

}

const ROAD_TO_NBA_CHAPTERS={
 hs_intro:{stage:"High School",title:"Chapter 1 • Nobody Knows Your Name",subtitle:"Senior Year • Northside HS",text:"The gym is half empty, the scouts are nowhere to be seen, and your coach tells you the truth: talent is not enough. This is your last high-school season to make people remember your name.",choices:[["grind","Stay After Practice"],["leader","Bring the Team With You"],["flash","Promise a Breakout Season"]]},
 hs_scout:{stage:"High School",title:"Chapter 2 • Eyes in the Bleachers",subtitle:"Recruiting Begins",text:"Two college assistants quietly take seats behind the baseline. Coach warns you not to chase highlights just because somebody important is watching.",choices:[["fundamentals","Play the Right Way"],["attack","Take Over the Game"],["teamfirst","Feed Your Teammates"]]},
 hs_rival:{stage:"High School",title:"Chapter 3 • The Other Prospect",subtitle:"Northside vs Westbridge",text:"Jaylen Cross, a nationally ranked guard from Westbridge Academy, tells a local reporter that you are 'having a nice little season.' The clip reaches your locker room before the game.",choices:[["answer","Answer on the Court"],["respect","Show Respect"],["fire","Make It Personal"]]},
 hs_pressure:{stage:"High School",title:"Chapter 4 • The Offer Table",subtitle:"Recruiting Pressure",text:"Offers are arriving, family members have opinions, and every coach is selling you a different future. Your high-school coach asks what actually matters to you.",choices:[["development","Best Development"],["spotlight","Biggest Spotlight"],["loyalty","Best Relationship"]]},
 college_arrival:{stage:"College",title:"Chapter 5 • Campus Is Different",subtitle:"Freshman Arrival",text:"The facilities are bigger, the practices are faster, and nobody cares what you did in high school. An upperclassman tells you freshmen have to earn everything here.",choices:[["humble","Start From Zero"],["compete","Challenge the Veterans"],["connect","Win the Locker Room"]]},
 college_role:{stage:"College",title:"Chapter 6 • Earn Your Minutes",subtitle:"Rotation Battle",text:"Your coach says your talent is obvious, but trust is not. A veteran at your position is getting the late-game minutes you want.",choices:[["defense","Win Minutes With Defense"],["work","Live in the Gym"],["speak","Ask Coach What You Need"]]},
 college_rival:{stage:"College",title:"Chapter 7 • National Television",subtitle:"The Rematch",text:"Jaylen Cross has become a college star too. The networks build your matchup as a battle between two future pros. For the first time, millions are watching.",choices:[["calm","Treat It Like Any Game"],["duel","Go At Cross"],["team","Win, Stats Second"]]},
 college_choice:{stage:"College",title:"Chapter 8 • One More Year?",subtitle:"Draft Decision",text:"Scouts like you, but some evaluators think another college season could raise your stock. Your inner circle is split between patience and taking the NBA opportunity now.",choices:[["declaremind","NBA Has Always Been the Goal"],["prove","I Still Have Things to Prove"],["business","Study the Draft Board"]]},
 combine_arrival:{stage:"Draft Combine",title:"Chapter 9 • Measurement Day",subtitle:"NBA Draft Combine",text:"Every measurement, drill and conversation is being logged. Executives who have never spoken to you are deciding whether you are worth millions of dollars.",choices:[["professional","Be All Business"],["confident","Tell Them You Belong"],["underdog","Remember Where You Started"]]},
 combine_interview:{stage:"Draft Combine",title:"Chapter 10 • The Interview Room",subtitle:"Front Office Interview",text:"A general manager asks the question every prospect fears: 'Why should we trust you with the future of our franchise?'",choices:[["winner","I Impact Winning"],["star","I Can Become a Star"],["worker","Nobody Will Outwork Me"]]},
 green_room:{stage:"Draft Combine",title:"Chapter 11 • Green Room",subtitle:"Draft Night Is Next",text:"Your phone is quiet. Mock drafts disagree on where you will go. Jaylen Cross walks by in a tailored suit and wishes you luck. Everything you worked for has come down to one night.",choices:[["family","Sit With Your Family"],["focus","Turn the Phone Off"],["cross","Talk With Cross"]]},
 drafted:{stage:"NBA",title:"Chapter 12 • Welcome to the League",subtitle:"Rookie Arrival",text:"The commissioner called your name. Cameras followed you through the tunnel, your phone exploded with messages, and now your new team hands you an NBA jersey with your name on it. The road here is finished. The real career starts now.",choices:[["grateful","Remember the Journey"],["hungry","This Is Only the Beginning"],["prove","Time to Prove Everyone Wrong"]]}
};
function ensureRoadToNBAState(){
 S.roadToNBA=S.roadToNBA||{};
 const r=S.roadToNBA;
 if(!Array.isArray(r.completed))r.completed=[];
 if(!Array.isArray(r.history))r.history=[];
 if(!Array.isArray(r.queue))r.queue=[];
 if(!r.flags)r.flags={};
 if(!Array.isArray(r.postgameFeed))r.postgameFeed=[];
 if(typeof r.recruitRank!=="number")r.recruitRank=145;
 if(typeof r.scoutInterest!=="number")r.scoutInterest=8;
 if(typeof r.lastOfferCount!=="number")r.lastOfferCount=(S.offers||[]).length;
 if(typeof r.nationalBuzz!=="number")r.nationalBuzz=0;
 if(!r.rival)r.rival={...ROAD_TO_NBA_RIVAL,heat:20,respect:50};
 if(!r.pending&&!r.completed.includes("hs_intro")&&S.stage==="High School")r.pending="hs_intro";
 if(r.finished===undefined)r.finished=false;
 return r
}
function roadToNBATransition(id){
 const r=ensureRoadToNBAState();
 if(r.completed.includes(id)||r.pending===id||r.queue.includes(id))return;
 if(r.pending)r.queue.push(id);else r.pending=id;
}
function roadChapterAvailable(id){
 const r=ensureRoadToNBAState(),gp=S.player.stats?.gp||0;
 if(r.completed.includes(id)||r.pending===id)return false;
 if(id==="hs_scout")return S.stage==="High School"&&gp>=2;
 if(id==="hs_rival")return S.stage==="High School"&&gp>=5;
 if(id==="hs_pressure")return S.stage==="High School"&&gp>=8;
 if(id==="college_role")return S.stage==="College"&&gp>=2;
 if(id==="college_rival")return S.stage==="College"&&gp>=5;
 if(id==="college_choice")return S.stage==="College"&&gp>=7;
 if(id==="combine_interview")return S.stage==="Draft Combine"&&Object.values(S.draftProcess?.events||{}).filter(Boolean).length>=1;
 if(id==="green_room")return S.stage==="Draft Combine"&&combineComplete();
 return false
}
function syncRoadToNBAStory(){
 const r=ensureRoadToNBAState();if(r.pending||r.finished)return;
 if(r.queue.length){r.pending=r.queue.shift();return}
 const order=["hs_scout","hs_rival","hs_pressure","college_role","college_rival","college_choice","combine_interview","green_room"];
 const next=order.find(roadChapterAvailable);if(next)r.pending=next;
}
function processRoadToNBAAfterGame(g){
 if(!["High School","College"].includes(S.stage)||!g)return;
 const r=ensureRoadToNBAState(),gp=S.player.stats?.gp||0,stage=S.stage;
 const perf=(g.pts||0)+(g.ast||0)*1.7+(g.reb||0)*1.1+(g.win?8:0);
 let headline="",body="",tag="",impact="",offer=null;
 if(stage==="High School"){
   const oldRank=r.recruitRank;
   const climb=perf>=48?12:perf>=38?8:perf>=28?4:g.win?2:-1;
   r.recruitRank=Math.max(1,Math.min(250,r.recruitRank-climb));
   r.scoutInterest=Math.max(0,Math.min(100,r.scoutInterest+(perf>=42?8:perf>=30?5:2)));
   r.nationalBuzz=Math.max(0,Math.min(100,r.nationalBuzz+(g.pts>=25?5:g.pts>=18?2:0)));
   if((S.offers||[]).length>r.lastOfferCount){offer=S.offers[S.offers.length-1];r.lastOfferCount=S.offers.length}
   if(offer){
     headline="Scholarship Offer Arrives";
     body=offer+" called your coach after the game and officially offered you a scholarship.";
     tag="RECRUITING";impact="Offer received • "+S.offers.length+" total";
   }else if(g.pts>=30){
     headline="Scouts Crowd the Tunnel";
     body="Your "+g.pts+"-point night changed the conversation. Multiple assistants wait outside the locker room while your coach reminds you the season is not over.";
     tag="SCOUT BUZZ";impact="National rank #"+oldRank+" → #"+r.recruitRank;
   }else if(!g.win){
     headline="The Ride Home Is Quiet";
     body="The loss stings. Coach tells you college staffs are watching how prospects respond when the highlights stop.";
     tag="ADVERSITY";impact="Next-game response matters";
   }else if(g.ast>=7){
     headline="Coaches Notice More Than Points";
     body="Recruiting notes praise your passing and control of the game. One scout calls you 'a player who raises the floor of everyone around him.'";
     tag="SCOUT REPORT";impact="Scout interest "+Math.round(r.scoutInterest)+"/100";
   }else{
     headline="Another Step Up the Board";
     body="Your phone has new follows from college staffers before you even leave the gym. The recruitment is beginning to feel real.";
     tag="RECRUITING";impact="National rank #"+r.recruitRank;
   }
   if(r.completed.includes("hs_rival")){
     if((g.pts||0)>=25)r.rival.heat=Math.min(100,r.rival.heat+5);
     if(g.win)r.rival.respect=Math.min(100,r.rival.respect+3)
   }
 }else{
   const stockBefore=S.player.draft||0;
   const bump=perf>=50?4:perf>=40?3:perf>=30?2:g.win?1:0;
   S.player.draft=Math.min(99,(S.player.draft||0)+bump);
   r.nationalBuzz=Math.max(0,Math.min(100,r.nationalBuzz+(g.pts>=25?4:g.win?1:0)));
   if(g.pts>=28){
     headline="NBA Scouts Stay After the Buzzer";
     body="Your performance has scouts comparing notes courtside. A front-office evaluator asks your coach for more film before leaving the arena.";
     tag="DRAFT STOCK";impact="Draft stock "+stockBefore+" → "+S.player.draft;
   }else if(g.win&&g.ast>=6){
     headline="Winning Plays Get Noticed";
     body="Your box score is not the only thing circulating. Scouts highlight your decision-making and how your team looked with you controlling the game.";
     tag="SCOUTING";impact="Draft stock +"+bump;
   }else if(!g.win){
     headline="Questions After a Tough Night";
     body="The postgame questions are sharper after the loss. Your coach tells you NBA evaluators care about the response more than the excuse.";
     tag="PRESSURE";impact="Next performance under evaluation";
   }else{
     headline="Draft Board Movement";
     body="Another solid college game adds to the file NBA teams are building on you. Your name is appearing more often in scouting conversations.";
     tag="NBA PATH";impact="Draft stock "+S.player.draft;
   }
 }
 const scene={id:"pg-"+Date.now()+"-"+gp,stage,game:gp,year:S.year,headline,body,tag,impact,offer,pts:g.pts,ast:g.ast,reb:g.reb,win:!!g.win,opp:g.opp};
 r.postgameFeed.unshift(scene);r.postgameFeed=r.postgameFeed.slice(0,30);g.roadPostgame=scene;
 syncRoadToNBAStory();
 if(r.pending){scene.chapterUnlocked=r.pending;scene.chapterTitle=ROAD_TO_NBA_CHAPTERS[r.pending]?.title||null}
 S.news.unshift("ROAD TO NBA • "+headline+" — "+impact);
}

function generateSeasonGoals(){
 const x=S.v018||{};S.v018=x;

  {id:"ppg25",label:"Average 25+ PPG",test:()=>S.player.stats.ppg>=25,reward:"35 XP"},
  {id:"apg8",label:"Average 8+ APG",test:()=>S.player.stats.apg>=8,reward:"35 XP"},
  {id:"rpg8",label:"Average 8+ RPG",test:()=>S.player.stats.rpg>=8,reward:"35 XP"},
  {id:"wins50",label:"Win 50 games",test:()=>S.record.w>=50,reward:"45 XP"},
  {id:"allstar",label:"Make the All-Star team",test:()=>!!S.nbaWorld?.allStar?.selected,reward:"50 XP"},
  {id:"chem80",label:"Reach 80 team chemistry",test:()=>S.player.chemistry>=80,reward:"30 XP"}
 ];
 const shuffled=pool.slice().sort(()=>Math.random()-.5).slice(0,3);
 x.seasonGoals=shuffled.map(g=>({id:g.id,label:g.label,reward:g.reward,completed:false}));

function v018GoalTest(id){
 if(id==="ppg25")return (S.player.stats?.ppg||0)>=25;
 if(id==="apg8")return (S.player.stats?.apg||0)>=8;
 if(id==="rpg8")return (S.player.stats?.rpg||0)>=8;

function processV018Game(g,oppId,isPlayoff,spot){
 if(S.stage!=="NBA")return;const x=ensureV018State();
 const margin=Math.abs((g.team||0)-(g.oppScore||0)),big=!!isPlayoff||spot?.tv==="National"||spot?.tv==="Prime Time";
 if(big){
  x.pressure.games++;
  let delta=(g.win?2:-2)+(g.pts>=30?2:0)+(margin<=5&&g.win?3:0);
  if(x.personality==="quiet")delta+=1;
  x.pressure.score=Math.max(0,Math.min(100,x.pressure.score+delta));
  if(margin<=5&&g.win)x.pressure.clutchWins++
 }
 if(oppId){
  x.teamRivalries[oppId]=Math.min(100,(x.teamRivalries[oppId]||0)+(isPlayoff?7:1)+(margin<=5?2:0));
 }
 if(x.signatureMove){
  if(x.signatureMove==="stepback"||x.signatureMove==="floater")S.player.xp+=Math.min(12,Math.floor((g.pts||0)/5));
  if(x.signatureMove==="dime")S.player.xp+=Math.min(12,(g.ast||0));
  if((x.signatureMove==="clamp"||x.signatureMove==="chasedown")&&g.win)S.player.xp+=8;
 }
 if(x.personality==="leader"&&g.ast>=6)S.player.chemistry=Math.min(100,S.player.chemistry+1);
 if(x.personality==="showman"&&g.pts>=30){S.social.followers+=2500;S.social.fame=Math.min(100,S.social.fame+1)}
 if(x.personality==="loyal"&&g.win)S.player.trust=Math.min(100,S.player.trust+1);
 if(big&&g.pts>=35&&Math.random()<.22){
  const story=g.win?"Your national-TV performance is going viral.":"Debate shows are questioning the team's response after your huge performance.";
  x.socialStories.unshift({year:S.year,text:story});x.socialStories=x.socialStories.slice(0,12);S.news.unshift("SOCIAL • "+story)
 }
 if(x.retirementTour.announced)x.retirementTour.games++;
}

 }
}

function badgeRank(name){const b=BADGES.find(x=>x[0]===name);if(!b)return 0;const t=badgeTierName(b);return {Locked:0,Bronze:1,Silver:2,Gold:3,Legend:4,"G.O.A.T.":5}[t]||0}
function clutchBadgeBoost(type){
 let names=[];
 if(type==="three")names=["Clutch Shooter","Deadeye","Limitless Range","Catch & Shoot","Open Looks","Killer Instinct","Ice in Veins","Big Game Player"];
 else if(type==="iso")names=["Quick First Step","Posterizer","Fearless Finisher","Slithery Finisher","Bulldozer","Fast Twitch","Killer Instinct","Ice in Veins","Comeback Kid"];
 else if(type==="pnr")names=["Dimer","Needle Threader","Floor General","Versatile Visionary","Bail Out","Ice in Veins"];
 else names=["Floor General","Dimer","Needle Threader","Big Game Player"];
 return Math.min(32,names.reduce((sum,n)=>sum+badgeRank(n)*2.15,0))
}
function defensiveClutchBoost(){return Math.min(28,["Clamps","Challenger","Interceptor","Anchor","Glove","On-Ball Menace","Paint Patroller","Lockdown Focus","Big Game Player"].reduce((sum,n)=>sum+badgeRank(n)*1.35,0))}
function clutchResponseChance(type){
 const a=S.player.attrs;
 const base=28+(ovr()-60)*1.15+(a.IQ-55)*.35+(S.player.energy-45)*.12+clutchBadgeBoost(type)+relationshipClutchBonus();
 return Math.max(20,Math.min(94,Math.round(base)))
}
function opponentAnswerChance(){
 const a=S.player.attrs;

}

function momentSkill(t){

 let base;if(t==="iso")base=(a.Finishing+a.Athleticism)/2;
 else if(t==="three")base=a.Shooting;

function resolveMoment(t){
 const g=S.live;if(!g)return;
 g.lastType=t;g.clutchPossessions=(g.clutchPossessions||0)+1;g.response=false;
 const success=momentSkill(t)+Math.random()*34>77;
 if(success){
   if(t==="three"){g.team+=3;g.pts+=3}
   else if(t==="pnr"){g.team+=2;g.ast++}
   else {g.team+=2;if(t==="iso")g.pts+=2;if(t==="team")S.player.trust=Math.min(100,S.player.trust+2)}
 }else{
   g.lastMessage="The defense wins the possession.";
   finishGame();return
 }
 const opponentScores=Math.random()*100<opponentAnswerChance();
 if(opponentScores){
   const three=Math.random()<.28,pts=three?3:2;g.oppScore+=pts;
   const chance=clutchResponseChance(t),underCap=g.clutchPossessions<MAX_CLUTCH_POSSESSIONS;
   const canRespond=underCap&&Math.random()*100<chance;
   g.lastMessage="They answered with "+pts+".";
   if(!underCap){
     g.lastMessage="Final clutch exchange complete.";
     finishGame();return
   }else if(canRespond){
     showClutchResult("They answered back","You executed, but "+g.opp+" scored again. You have "+(MAX_CLUTCH_POSSESSIONS-g.clutchPossessions)+" clutch chance"+((MAX_CLUTCH_POSSESSIONS-g.clutchPossessions)===1?"":"s")+" left. Response chance: "+chance+"%. You earned another possession.",true)
   }else{
     g.lastMessage="Opponent answered and no extra response was earned.";
     finishGame();return
   }
 }else{
   g.lastMessage="Your defense gets the stop.";
   if(g.team>g.oppScore){
     g.win=true;
     const finalScore=g.team+"-"+g.oppScore;
     S.news.unshift("Clutch win: "+S.player.name+" delivered and the defense got the stop • "+finalScore+".");
     S.live=null;
     recordGame(g);
     toast("CLUTCH WIN • "+finalScore);
     return
   }
   finishGame();return
 }
}
function normalizeFinalScore(g){
 if(!g||g.scoreNormalized)return g;
 const nba=g.stage==="NBA"||S.stage==="NBA";
 if(!nba){g.scoreNormalized=true;return g}
 const playoff=!!g.playoff,originalDiff=Math.abs((g.team||0)-(g.oppScore||0));
 let winnerTarget=(playoff?104:110)+Math.floor(Math.random()*(playoff?20:21));
 winnerTarget=Math.max(winnerTarget,(g.pts||0)+42);
 winnerTarget=Math.min(145,winnerTarget);
 let margin=Math.max(1,Math.min(28,originalDiff||1));
 if(originalDiff>28)margin=28+Math.floor(Math.random()*7);
 const loserTarget=Math.max(playoff?92:96,winnerTarget-margin);
 if(g.win===undefined)g.win=(g.team||0)>(g.oppScore||0);
 if(g.win){g.team=winnerTarget;g.oppScore=loserTarget}else{g.oppScore=winnerTarget;g.team=loserTarget}
 g.scoreNormalized=true;return g
}

window.addEventListener("pagehide",()=>{if(S&&S.created)save()});window.addEventListener("error",e=>{console.error("MYCAREER error",e.error||e.message);const content=$("content");if(content&&!content.innerHTML.trim())content.innerHTML='<section class="card s12"><h3>MYCAREER recovered from an error</h3><p class="muted">Tap New Career again. Your save has not been deleted.</p><button class="btn primary" id="recoverBtn">Return Home</button></section>';const r=$("recoverBtn");if(r)r.onclick=()=>{S.screen="home";render()}});$("profileBtn").onclick=()=>frontMode==="career"&&S.created?openAppearance():null;$("modalWrap").onclick=e=>{if(e.target===$("modalWrap"))closeModal()};render();maybeSendPreviewTransfer();
</script>
