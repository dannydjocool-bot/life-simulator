function merge(a,b){for(const k in b){if(a[k]===undefined)a[k]=b[k];else if(a[k]&&b[k]&&typeof a[k]==="object"&&!Array.isArray(a[k])&&!Array.isArray(b[k]))merge(a[k],b[k])}return a}

function slotKey(slot){return "mycareer-v03-slot"+slot}
function migrateLegacySave(){if(localStorage.getItem(slotKey(1)))return;const old=localStorage.getItem("mycareer-v03");if(!old)return;try{const data=JSON.parse(old);if(data&&data.created){localStorage.setItem(slotKey(1),old);localStorage.setItem("mycareer-active-slot","1")}}catch(e){}}

function loadSlot(slot){try{return merge(JSON.parse(localStorage.getItem(slotKey(slot))||"{}"),fresh())}catch(e){return fresh()}}

function render(){if(!S.careerHistory)S.careerHistory={highSchool:null,collegeSeasons:[]};if(!S.training)S.training={used:0,max:3};if(typeof S.training.max!=="number")S.training.max=3;if(typeof S.training.used!=="number")S.training.used=0;if(typeof S.training.recovered!=="boolean")S.training.recovered=false;if(!S.finance)S.finance={cash:1000,earnings:0,owned:[],sponsor:null,sponsors:[],contract:null};if(!Array.isArray(S.finance.owned))S.finance.owned=[];if(!Array.isArray(S.finance.sponsors))S.finance.sponsors=[];if(S.finance.sponsor&&S.finance.sponsors.length===0)S.finance.sponsors=[S.finance.sponsor];if(!S.social)S.social={followers:100,fame:0,posted:false,posts:0};if(typeof S.social.followers!=="number")S.social.followers=100;if(typeof S.social.fame!=="number")S.social.fame=0;if(typeof S.social.posted!=="boolean")S.social.posted=false;if(!S.draftProcess)S.draftProcess={declared:false,combineDone:false,events:{shooting:false,agility:false,scrimmage:false},boost:0,pick:null};if(!S.draftProcess.events)S.draftProcess.events={shooting:false,agility:false,scrimmage:false};if(!S.careerStats)S.careerStats={highSchool:{gp:0,pts:0,ast:0,reb:0},college:{gp:0,pts:0,ast:0,reb:0},nba:{gp:0,pts:0,ast:0,reb:0}};if(!S.saveMeta)S.saveMeta={lastSaved:null,manualSaves:0};if(!S.playoffs)S.playoffs={active:false,qualified:false,round:0,seriesWins:0,seriesLosses:0,opponentId:null,seed:null,opponentSeed:null,champion:false,eliminated:false};if(!S.offseason)S.offseason={active:false,generated:false,draftClass:[],teamDrafts:[],contractOffers:[],decisionMade:false,draftApplied:false};if(typeof S.offseason.draftApplied!=="boolean")S.offseason.draftApplied=false;if(!Array.isArray(S.leagueNews))S.leagueNews=[];if(!Array.isArray(S.accolades))S.accolades=[];if(S.seasonAwards===undefined)S.seasonAwards=null;if(S.playoffBracket===undefined)S.playoffBracket=null;if(typeof S.player.chemistry!=="number")S.player.chemistry=60;if(!S.player.role)S.player.role="Rotation";if(typeof S.player.minutes!=="number")S.player.minutes=22;if(S.player.injury===undefined)S.player.injury=null;if(!S.coach)S.coach={talks:0,lastRequestGame:0,tradeRequested:false,targetPlayer:null};if(S.fullGame===undefined)S.fullGame=null;if(S.postgameMedia===undefined)S.postgameMedia=null;if(!S.mediaProfile)S.mediaProfile={interviews:0,rivalryHeat:0};if(S.stage==="NBA"&&!S.team){S.team="bos"}ensureAppearance();nav();head();if(!S.created){$("content").innerHTML=startView();bindStart();return}const views={home:home,career:career,games:games,player:player,life:life,league:league};$("content").innerHTML=(views[S.screen]||home)();bindDynamic()}

function nbaTeamById(id){return NBA_TEAMS.find(t=>t.id===id)||null}
function teamNameById(id){const t=nbaTeamById(id);return t?t.city+" "+t.name:"NBA Team"}
function currentTeamName(){if(S.team&&(S.stage==="NBA"||S.stage==="Offseason"))return teamNameById(S.team);if(S.stage==="College")return S.college||"College";if(S.stage==="Draft Combine")return "NBA Draft Prospect";return "Northside HS"}
function opponentPool(){if(S.stage==="NBA")return NBA_TEAMS.filter(t=>t.id!==S.team).map(t=>t.city+" "+t.name);if(S.stage==="College")return COLLEGES.filter(x=>x!==S.college);return HS_TEAMS}
function combineComplete(){const e=S.draftProcess&&S.draftProcess.events;return !!(e&&e.shooting&&e.agility&&e.scrimmage)}
function combineEvent(id){if(S.stage!=="Draft Combine"){toast("You are not in the Draft Combine");return}const e=S.draftProcess.events;if(e[id]){toast("That combine event is already complete");return}let boost=0,label="";if(id==="shooting"){boost=Math.max(1,Math.min(5,Math.round((S.player.attrs.Shooting-55)/9)+Math.floor(Math.random()*2)));label="Shooting Drill"}else if(id==="agility"){boost=Math.max(1,Math.min(5,Math.round((S.player.attrs.Athleticism-55)/9)+Math.floor(Math.random()*2)));label="Agility Test"}else{boost=Math.max(1,Math.min(6,Math.round(((S.player.attrs.IQ+S.player.attrs.Playmaking+S.player.attrs.Defense)/3-55)/8)+Math.floor(Math.random()*2)));label="5-on-5 Scrimmage"}e[id]=true;S.draftProcess.boost+=boost;S.player.draft=Math.min(99,S.player.draft+boost);S.player.xp+=60+boost*10;if(combineComplete())S.draftProcess.combineDone=true;S.news.unshift(label+" complete: Draft Stock +"+boost+".");save();render();toast(label+" • Draft Stock +"+boost)}
function completeDraftNight(){if(S.stage!=="Draft Combine"||!combineComplete()){toast("Finish every combine event first");return}const rating=ovr(),stock=S.player.draft;let pick=Math.max(1,Math.min(30,31-Math.round((stock*.65+rating*.35-55)/44*29)));if(!Number.isFinite(pick))pick=30;const team=NBA_TEAMS[(pick-1)%NBA_TEAMS.length];let deal;if(pick<=10)deal={label:"Lottery Rookie Deal",years:4,total:36000000,perGame:110000};else if(pick<=20)deal={label:"First-Round Rookie Deal",years:4,total:18000000,perGame:55000};else deal={label:"Late First / Second-Round Deal",years:3,total:8000000,perGame:28000};S.draftProcess.pick=pick;S.team=team.id;S.stage="NBA";S.year=1;S.record={w:0,l:0};S.game=1;deal.yearsRemaining=deal.years;S.finance.contract=deal;S.player.age=Math.max(19,S.player.age+1);S.leagueStandings=null;S.leagueRosters=null;ensureLeagueStandings();ensureLeagueRosters();updateRole();S.news.unshift("Draft Night: Pick #"+pick+" — "+team.city+" "+team.name+" selected you. Signed "+deal.label+".");S.social.fame=Math.min(100,S.social.fame+15);S.social.followers+=5000;S.training.used=0;S.training.max=3;S.training.recovered=false;S.social.posted=false;save();setScreen("home");toast("Drafted #"+pick+" by "+team.city+" "+team.name)}
function stageStats(){const key=(S.stage==="NBA"||S.stage==="Offseason")?"nba":S.stage==="College"?"college":"highSchool";return S.careerStats[key]}
function statLineCard(){const st=S.player.stats,cs=stageStats();return '<div class="row"><span>Season</span><strong>'+st.ppg.toFixed(1)+' PPG • '+st.apg.toFixed(1)+' APG • '+st.rpg.toFixed(1)+' RPG</strong></div><div class="row"><span>Career '+S.stage+'</span><strong>'+cs.gp+' GP • '+cs.pts+' PTS • '+cs.ast+' AST • '+cs.reb+' REB</strong></div>'}

S.offseason.decisionMade?'':'disabled')+'>Start NBA Year '+(S.year+1)+'</button></section></div>'

function career(){if(S.stage==="Offseason")return offseasonCareerView();const hs=S.careerHistory&&S.careerHistory.highSchool;const combine=S.stage==="Draft Combine",nba=S.stage==="NBA",myTeam=nbaTeamById(S.team);return '<div class="grid" style="margin-top:0"><section class="card s8"><h3>Career Path</h3><div class="list"><div class="item"><div><b>High School Senior</b><small>'+(hs?hs.record.w+"-"+hs.record.l+" final record • "+hs.games+" games":S.player.stats.gp+" games played • "+S.offers.length+" scholarship offers")+'</small></div><span class="pill">'+(S.college?"COMPLETE":"ACTIVE")+'</span></div><div class="item"><div><b>College Basketball</b><small>'+(S.college?S.college+" • "+(combine||nba?"completed":"Year "+S.year):"Earn offers and choose a school")+'</small></div><span class="pill '+(S.college?"good":"")+'">'+(S.college?(combine||nba?"COMPLETE":"COMMITTED"):"LOCKED")+'</span></div><div class="item"><div><b>Draft Combine</b><small>'+(combine?S.draftProcess.boost+" Draft Stock gained":nba?"Completed before Draft Night":"Declare after college eligibility")+'</small></div><span class="pill '+(combine?"good":"")+'">'+(combine?"ACTIVE":nba?"COMPLETE":"FUTURE")+'</span></div><div class="item"><div><b>NBA Career</b><small>'+(nba&&myTeam?myTeam.city+" "+myTeam.name+" • Rookie season":"Get drafted after the combine")+'</small></div><span class="pill '+(nba?"good":"")+'">'+(nba?"ACTIVE":"LOCKED")+'</span></div></div></section><section class="card"><h3>'+(nba?"Current Team":S.college?"Commitment":"Offers")+'</h3>'+(nba&&myTeam?'<div class="big" style="font-size:24px">'+myTeam.city+' '+myTeam.name+'</div><p class="muted">Drafted #'+(S.draftProcess.pick||"—")+'</p><span class="pill good">'+myTeam.abbr+'</span>':S.college?'<div class="big" style="font-size:26px">'+S.college+'</div><p class="muted">Your college choice is locked in for this career.</p><span class="pill good">SIGNED</span>':'<div class="big">'+S.offers.length+'</div><p class="muted">Scholarships</p>'+(S.offers.length?'<button class="btn primary" id="chooseCollege">Choose College</button>':'<span class="pill">Keep playing</span>'))+'</section><section class="card s12"><h3>Your Stats</h3>'+statLineCard()+'</section>'+(S.college&&!combine&&!nba?'<section class="card s12"><h3>NBA Path</h3><p class="muted">After 8 college games and 55 Draft Stock, declare for the draft. You will go to the Draft Combine before Draft Night.</p><button class="btn primary" id="declareDraft" '+((S.game-1)>=8&&S.player.draft>=55?'':'disabled')+'>Declare for NBA Draft</button></section>':'')+(combine?'<section class="card s12"><h3>NBA Draft Combine</h3><p class="muted">Complete all three events to boost Draft Stock before Draft Night.</p><div class="list"><button class="btn" data-combine="shooting" '+(S.draftProcess.events.shooting?'disabled':'')+'>Shooting Drill '+(S.draftProcess.events.shooting?'✓':'')+'</button><button class="btn" data-combine="agility" '+(S.draftProcess.events.agility?'disabled':'')+'>Agility Test '+(S.draftProcess.events.agility?'✓':'')+'</button><button class="btn" data-combine="scrimmage" '+(S.draftProcess.events.scrimmage?'disabled':'')+'>5-on-5 Scrimmage '+(S.draftProcess.events.scrimmage?'✓':'')+'</button></div><div class="row"><span>Draft Stock</span><strong>'+S.player.draft+'</strong></div><div class="row"><span>Combine Boost</span><strong>+'+S.draftProcess.boost+'</strong></div><button class="btn primary" id="draftNightBtn" '+(combineComplete()?'':'disabled')+'>Go to Draft Night</button></section>':'')+'</div>'}
function ensureLeagueRosters(){
 if(S.leagueRosters&&Object.keys(S.leagueRosters).length===NBA_TEAMS.length)return;
 S.leagueRosters={};
 NBA_TEAMS.forEach(t=>{S.leagueRosters[t.id]=t.stars.map(p=>({...p,source:"veteran"}))})
}
function rosterFor(id){ensureLeagueRosters();return S.leagueRosters[id]||[]}
function teamLeader(t){const r=t?rosterFor(t.id):[];return r[0]||null}
function currentCoach(){const t=nbaTeamById(S.team);return t?t.coach:"Coach"}
function ensureLeagueStandings(){
 if(S.leagueStandings&&Object.keys(S.leagueStandings).length===NBA_TEAMS.length)return;
 S.leagueStandings={};NBA_TEAMS.forEach(t=>S.leagueStandings[t.id]={w:0,l:0});
 if(S.team)S.leagueStandings[S.team]={w:S.record.w,l:S.record.l}
}
function teamPower(t){const r=rosterFor(t.id).slice(0,3);if(!r.length)return 50;return r.reduce((sum,p)=>sum+p.ppg+p.apg*.55+p.rpg*.35,0)/r.length}
function simulateOtherTeamsOneGame(){
 if(S.stage!=="NBA"||S.playoffs.active)return;
 ensureLeagueStandings();ensureLeagueRosters();
 NBA_TEAMS.filter(t=>t.id!==S.team).forEach(t=>{const r=S.leagueStandings[t.id];if(r.w+r.l>=Math.min(82,S.record.w+S.record.l+1))return;const power=teamPower(t);const win=Math.random()*50+power>57;r[win?"w":"l"]++})
}
function conferenceSeeds(conf){
 ensureLeagueStandings();
 return NBA_TEAMS.filter(t=>t.conf===conf).sort((a,b)=>{const ra=S.leagueStandings[a.id],rb=S.leagueStandings[b.id];const ap=ra.w/Math.max(1,ra.w+ra.l),bp=rb.w/Math.max(1,rb.w+rb.l);return bp-ap||rb.w-ra.w}).map((t,i)=>({...t,seed:i+1,rec:S.leagueStandings[t.id]}))
}
function tradeDeadlineOpen(){return S.stage==="NBA"&&!S.playoffs.active&&(S.record.w+S.record.l)<60}
function updateRole(){
 const trust=S.player.trust,overall=ovr(),chem=S.player.chemistry;
 let role="Bench",min=14;if(overall>=84&&trust>=78){role="Franchise Star";min=36}else if(overall>=78&&trust>=68){role="Starter";min=32}else if(overall>=70&&trust>=58){role="Sixth Man";min=27}else if(overall>=64||chem>=65){role="Rotation";min=22}
 S.player.role=role;S.player.minutes=min
}
function pushLeagueNews(msg){S.leagueNews=S.leagueNews||[];S.leagueNews.unshift(msg);S.leagueNews=S.leagueNews.slice(0,20)}
function playoffRoundName(){return ["","First Round","Conference Semifinals","Conference Finals","NBA Finals"][S.playoffs.round]||"Playoffs"}
function playoffGameNumber(){return Math.min(7,(Math.min(4,S.playoffs.seriesWins||0)+Math.min(4,S.playoffs.seriesLosses||0)+1))}
function playoffWinsNeeded(){return Math.max(0,4-(S.playoffs.seriesWins||0))}
function playoffBanner(){
 if(!(S.playoffs&&S.playoffs.active))return "";
 const opp=playoffOpponent(),mine=nbaTeamById(S.team);
 const myName=mine?mine.city+" "+mine.name:currentTeamName(),oppName=opp?opp.city+" "+opp.name:"Opponent";
 const wins=Math.min(4,S.playoffs.seriesWins||0),losses=Math.min(4,S.playoffs.seriesLosses||0);
 const myDots=Array.from({length:4},(_,i)=>'<i class="'+(i<wins?'on':'')+'"></i>').join("");
 const oppDots=Array.from({length:4},(_,i)=>'<i class="'+(i<losses?'on':'')+'"></i>').join("");
 return '<section class="playoffBanner"><div class="playoffTop"><div><span class="kicker">NBA PLAYOFFS • ROUND '+S.playoffs.round+' OF 4</span><div class="playoffRound">'+playoffRoundName()+'</div><p class="muted" style="margin:0">Game '+playoffGameNumber()+' • Best-of-7 • First to 4 wins</p></div><span class="pill good">#'+S.playoffs.seed+' vs #'+S.playoffs.opponentSeed+'</span></div><div class="playoffMatch"><div class="playoffTeam"><b>#'+S.playoffs.seed+' '+myName+'</b><div class="playoffDots">'+myDots+'</div></div><div class="playoffScore">'+wins+' - '+losses+'</div><div class="playoffTeam"><b>#'+S.playoffs.opponentSeed+' '+oppName+'</b><div class="playoffDots">'+oppDots+'</div></div></div><div class="playoffNeed"><strong>'+playoffWinsNeeded()+' win'+(playoffWinsNeeded()===1?'':'s')+' needed to advance</strong><span class="muted">'+(S.playoffs.seriesWins>S.playoffs.seriesLosses?'Series lead':S.playoffs.seriesWins<S.playoffs.seriesLosses?'Series deficit':'Series tied')+'</span></div></section>'
}
function makeSeries(conf,a,b){return {conf,a:a.id,b:b.id,seedA:a.seed,seedB:b.seed,wA:0,wB:0,winner:null}}
function buildFirstRoundBracket(){
 const e=conferenceSeeds("East").slice(0,8),w=conferenceSeeds("West").slice(0,8),pairs=[[0,7],[3,4],[2,5],[1,6]];
 S.playoffBracket={1:[...pairs.map(x=>makeSeries("East",e[x[0]],e[x[1]])),...pairs.map(x=>makeSeries("West",w[x[0]],w[x[1]]))],2:[],3:[],4:[]}
}
function seriesPower(id){const t=nbaTeamById(id),r=S.leagueStandings[id]||{w:0,l:0};return teamPower(t)+r.w*.28}
function simulateSeries(s){if(s.winner)return s.winner;const pa=seriesPower(s.a),pb=seriesPower(s.b),aWins=Math.random()*100<50+(pa-pb)*1.2;s.winner=aWins?s.a:s.b;const loserWins=Math.floor(Math.random()*4);s.wA=aWins?4:loserWins;s.wB=aWins?loserWins:4;return s.winner}
function currentUserBracketSeries(){if(!S.playoffBracket)return null;return (S.playoffBracket[S.playoffs.round]||[]).find(s=>s.a===S.team||s.b===S.team)||null}

   const out=[];for(const conf of ["East","West"]){const winners=prev.filter(s=>s.conf===conf).map(s=>s.winner);for(let i=0;i<winners.length;i+=2){const a=nbaTeamById(winners[i]),b=nbaTeamById(winners[i+1]);if(a&&b)out.push({conf,a:a.id,b:b.id,seedA:(conferenceSeeds(conf).find(x=>x.id===a.id)||{}).seed||0,seedB:(conferenceSeeds(conf).find(x=>x.id===b.id)||{}).seed||0,wA:0,wB:0,winner:null})}}S.playoffBracket[round]=out

function gradeValue(letter){return {"A+":5,"A":4.5,"A-":4,"B+":3.5,"B":3,"B-":2.5,"C+":2,"C":1.5,"C-":1,"D+":.5,"D":0}[letter]||0}
function fullGameFollowerGain(g,out){
 const peak=Math.max(0,g.peakViewers||0),grade=gameGradeLetter(g.grade),perf=g.stats;
 let gain=Math.round(peak*.0012+perf.pts*120+perf.ast*180+perf.reb*100+gradeValue(grade)*650+(g.hype||0)*45);gain=Math.round(gain*(1+badgeRank("Big Game Player")*.04));
 if(out.win)gain=Math.round(gain*1.15);
 if(g.playoff)gain=Math.round(gain*(S.playoffs&&S.playoffs.round===4?2.2:1.55));
 if(perf.pts>=40)gain+=8000;else if(perf.pts>=30)gain+=3500;
 if(perf.ast>=10||perf.reb>=10)gain+=2200;
 return Math.max(250,Math.min(250000,gain))
}
function postgameInterviewEligible(g,out){
 if(g.stage==="NBA")return !!(g.playoff||g.peakViewers>=3000000||g.stats.pts>=30||gradeValue(out.grade)>=4);
 if(g.stage==="College")return g.peakViewers>=500000||g.stats.pts>=25||gradeValue(out.grade)>=4;
 return g.stats.pts>=30
}
function postgameHeadline(m,tone){
 const p=S.player.name,opp=m.opp,pts=m.pts;
 if(tone==="humble")return p+" credits the team after "+pts+"-point performance vs "+opp+".";
 if(tone==="confident")return p+" embraces the spotlight after dropping "+pts+" on "+opp+".";
 if(tone==="rivalry")return p+" turns up the rivalry after a nationally watched game vs "+opp+".";
 if(tone==="team")return p+" praises teammates after the win over "+opp+".";
 return p+" draws major attention after a huge night vs "+opp+"."
}

function resolvePostgameInterview(tone){

 if(tone==="humble"){S.player.trust=Math.min(100,S.player.trust+3);S.player.chemistry=Math.min(100,S.player.chemistry+2);extra=Math.round(m.followersGained*.08)}

 if(tone==="rivalry"){S.social.fame=Math.min(100,S.social.fame+3.5);S.mediaProfile.rivalryHeat=Math.min(100,(S.mediaProfile.rivalryHeat||0)+12);extra=Math.round(m.followersGained*.3);S.player.trust=Math.max(0,S.player.trust-1)}

}

 const followersGain=fullGameFollowerGain(g,out);S.social.followers+=followersGain;S.social.fame=Math.min(100,S.social.fame+Math.min(3,g.hype/70));

}

function player(){const p=S.player;const overall=ovr();const best=Object.entries(p.attrs).sort((a,b)=>b[1]-a[1]).slice(0,2);const available=DRILLS.filter(d=>overall>=d.min);const locked=DRILLS.filter(d=>overall<d.min);return '<div class="grid" style="margin-top:0"><section class="card s12"><div style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap"><div><span class="kicker">PLAYER OVERVIEW</span><h2 style="margin:5px 0 4px;font-size:28px">'+p.name+'</h2><p class="muted" style="margin:0">'+p.position+' • '+p.height+' • '+p.archetype+' • '+S.stage+(S.college?" • "+S.college:"")+'</p></div><div style="text-align:center;min-width:96px"><div class="big" style="font-size:48px;line-height:1">'+overall+'</div><small class="muted" style="font-weight:900;letter-spacing:1px">OVERALL</small></div></div><div class="actions" style="margin-top:14px"><span class="pill good">LV '+p.level+'</span><span class="pill">'+best[0][0]+' '+best[0][1]+'</span><span class="pill">'+best[1][0]+' '+best[1][1]+'</span></div></section><section class="card s8"><h3>Attributes <span class="pill" style="float:right">'+overall+' OVR</span></h3>'+Object.entries(p.attrs).map(([k,v])=>meter(k,v)).join("")+'</section><section class="card"><h3>Development</h3><div class="big">LV '+p.level+'</div><p class="muted">'+p.xp+'/'+(p.level*220)+' XP</p>'+meter("Energy",p.energy)+meter("Draft Stock",p.draft)+'</section><section class="card s12"><h3>Training Gym <span class="pill" style="float:right">'+Math.max(0,S.training.max-S.training.used)+' LEFT</span></h3><p class="muted">'+S.training.used+'/'+S.training.max+' sessions used. Higher OVR unlocks advanced drills. All sessions reset after a game.</p><div class="grid" style="margin-top:10px">'+available.map(d=>'<div class="card" style="grid-column:span 4"><b>'+d.name+'</b><p class="muted">'+d.desc+'</p><small class="muted">'+d.energy+' energy • unlock '+d.min+' OVR</small><div style="margin-top:10px"><button class="btn" data-dr es yet.</p>')+'</div></section><section class="card s12"><h3>Appearance & Identity</h3><div class="appearanceCard"><div>'+avatarMarkup("md",p)+'</div><div style="flex:1;min-width:220px"><div class="row"><span>Jersey</span><strong>#'+p.number+'</strong></div><div class="row"><span>Hair</span><strong>'+p.appearance.hairStyle+' / '+p.appearance.hairColor+'</strong></div><div class="row"><span>Accessory</span><strong>'+p.appearance.accessory+'</strong></div><div class="actions"><button class="btn primary" id="editAppearance">Customize Face & Look</button></div></div></div></section><section class="card s12"><h3>Badges</h3><div class="badgeCats">'+["Finishing","Shooting","Playmaking","Defense","Rebounding","Athleticism","Mental / Clutch"].map(badgeSection).join("")+'</div></section></div>'}
function badgeScore(b){let v=S.player.attrs[b[2]]*b[3];if(b[4])v+=S.player.attrs[b[4]]*b[5];return Math.round(v)}
function tier(v){

  if(v>=94&&overall>=90)return "Legend";
  if(v>=82&&overall>=80)return "Gold";

ame.toLocaleString()+'/game</small></div><span class="pill good">ACTIVE</span></div>').join(""):'<div class="item"><div><b>No active endorsements</b><small>Sign your first deal below.</small></div></div>')+'</div>'+(goal?'<div class="item" style="margin-top:10px"><div><b>Next Target: '+goal.name+'</b><small>Needs '+goal.ovr+' OVR • '+goal.followers.toLocaleString()+' followers • '+goal.fame+' Fame</small></div><span class="pill">'+goal.tier+'</span></div>':'')+'</section><section class="card s12"><h3>Available Endorsements</h3><p class="muted">Low-end local deals appear early. Higher-end opportunities unlock as your performance, OVR, fame and audience grow.</p><div class="list">'+(eligible.length?eligible.map(s=>'<div class="item"><div><b>'+s.name+' <span class="pill">'+s.tier+'</span></b><small>'+s.category+' • $'+s.bonus.toLocaleString()+' signing • $'+s.perGame.toLocaleString()+'/game</small></div><button class="btn" data-sponsor="'+s.id+'" '+(active.length>=slots?'disabled':'')+'>Sign</button></div>').join(""):'<div class="item"><div><b>No new offers right now</b><small>Keep playing, posting, and improving your OVR.</small></div></div>')+'</div></section><section class="card s12"><h3>Store & Assets</h3><div class="grid storeGrid" style="margin-top:0">'+STORE_ITEMS.map(x=>'<div class="card storeCard"><b>'+x.name+'</b><p class="muted">'+x.desc+'</p><div class="row storeRow"><span>'+x.type+'</span><strong>$'+x.price.toLocaleString()+'</strong></div>'+(x.income?'<div class="row storeRow"><span>Income/game</span><strong>$'+x.income.toLocaleString()+'</strong></div>':'')+'<button class="btn '+(S.finance.owned.includes(x.id)?'good':'')+'" data-buy="'+x.id+'" '+(S.finance.owned.includes(x.id)?'disabled':'')+'>'+(S.finance.owned.includes(x.id)?'Owned':'Buy')+'</button></div>').join("")+'</div></section><section class="card s12"><h3>Owned Assets</h3>'+(owned.length?owned.map(x=>'<div class="row"><span>'+x.name+'</span><strong>'+(x.income?'$'+x.income.toLocaleString()+'/game':x.type)+'</strong></div>').join(""):'<p class="muted">No assets purchased yet.</p>')+'</section></div>'}

function signSponsor(id){const s=SPONSORS.find(x=>x.id===id);if(!s)return;if(!sponsorEligible(s)){toast("You no longer meet this deal");return}if(activeSponsors().some(a=>a.id===id)){toast("Deal already active");return}if(activeSponsors().length>=endorsementSlots()){toast("No endorsement slots available yet");return}S.finance.sponsors.push({...s});S.finance.sponsor=S.finance.sponsors[0]||null;S.finance.cash+=s.bonus;S.finance.earnings+=s.bonus;S.news.unshift("Signed "+s.name+" ("+s.tier+") for $"+s.bonus.toLocaleString()+" up front.");S.social.fame=Math.min(100,S.social.fame+1);save();render();toast(s.name+" signed")}

function drillTrain(id){const d=DRILLS.find(x=>x.id===id);if(!d)return;if(ovr()<d.min){toast("Requires "+d.min+" OVR");return}if(S.training.used>=S.training.max){toast("Training locked — play a game to reset");return}if(S.player.energy<d.energy){toast("Not enough energy");return}S.training.used++;S.player.energy-=d.energy;const gains=[];for(const [k,r] of Object.entries(d.gains)){const gain=r[0]+Math.floor(Math.random()*(r[1]-r[0]+1));if(gain>0){S.player.attrs[k]=Math.min(99,S.player.attrs[k]+gain);gains.push(k+" +"+gain)}}S.player.xp+=d.xp;S.player.draft=Math.min(99,S.player.draft+1);let leveled=false;while(S.player.xp>=S.player.level*220){S.player.xp-=S.player.level*220;S.player.level++;S.player.attrs.IQ=Math.min(99,S.player.attrs.IQ+1);S.player.attrs.Athleticism=Math.min(99,S.player.attrs.Athleticism+1);leveled=true}save();render();toast(leveled?"Level "+S.player.level+" reached!":gains.join(" • "))}
function league(){ensureLeagueStandings();ensureLeagueRosters();const mine=nbaTeamById(S.team),east=conferenceSeeds("East"),west=conferenceSeeds("West");const table=(arr,title)=>'<section class="card s6"><h3>'+title+'</h3>'+arr.map(t=>{const lead=teamLeader(t);return '<div class="row"><span><b>#'+t.seed+' '+t.city+' '+t.name+'</b><small class="muted" style="display:block">'+(lead?lead.name+' • '+lead.ppg.toFixed(1)+' PPG':'No leader')+'</small></span><strong>'+t.rec.w+'-'+t.rec.l+'</strong></div>'}).join("")+'</section>';return '<div class="grid" style="margin-top:0">'+(mine?'<section class="card s12"><span class="kicker">YOUR NBA TEAM</span><h2 style="margin:6px 0">'+mine.city+' '+mine.name+'</h2><p class="muted">'+mine.conf+' • '+currentCoach()+' • Record '+S.record.w+'-'+S.record.l+' • '+S.player.role+'</p>'+statLineCard()+'</section>':'')+table(east,"Eastern Conference")+table(west,"Western Conference")+'<section class="card s12"><h3>Team Rosters & Stars</h3><div class="list">'+NBA_TEAMS.map(t=>'<div class="item"><div><b>'+(S.team===t.id?'★ ':'')+t.city+' '+t.name+'</b><small>'+rosterFor(t.id).slice(0,4).map(s=>s.name+' ('+s.pos+') '+s.ppg.toFixed(1)+' PPG / '+s.apg.toFixed(1)+' APG / '+s.rpg.toFixed(1)+' RPG').join(' • ')+'</small></div></div>').join("")+'</div></section>'+(S.playoffs.active?playoffBanner():'')+'<section class="card s12"><h3>Playoff Bracket</h3>'+playoffBracketHTML()+'</section><section class="card s6"><h3>League News</h3><div class="list">'+(S.leagueNews.length?S.leagueNews.slice(0,8).map(n=>'<div class="item"><small>'+n+'</small></div>').join(""):'<p class="muted">League news will build as the season progresses.</p>')+'</div></section><section class="card s6"><h3>Your Career Resume</h3><div class="list">'+(S.accolades.length?S.accolades.map(a=>'<div class="item"><b>'+a+'</b></div>').join(""):'<p class="muted">No major accolades yet.</p>')+'</div></section><section class="card s12"><h3>Your Scouting Report</h3><p class="muted">'+scout()+'</p></section></div>'}function scout(){const a=Object.entries(S.player.attrs).sort((a,b)=>b[1]-a[1]);return S.player.name+' projects as a '+S.player.archetype+'. Strongest areas: '+a[0][0]+' and '+a[1][0]+'. Biggest development need: '+a[a.length-1][0]+'.'}
function bindDynamic(){document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>setScreen(b.dataset.go));if($("chooseCollege"))$("chooseCollege").onclick=collegeModal;if($("fullGameBtn"))$("fullGameBtn").onclick=startFullGame;if($("keyMom"))$("keyMom").onclick=startMoment;if($("quickSim"))$("quickSim").onclick=quickSim;document.querySelectorAll("[data-moment]").forEach(b=>b.onclick=()=>resolveMoment(b.dataset.moment));document.querySelectorAll("[data-full-off]").forEach(b=>b.onclick=()=>fullOffense(b.dataset.fullOff));document.querySelectorAll("[data-full-def]").forEach(b=>b.onclick=()=>fullDefense(b.dataset.fullDef));document.querySelectorAll("[data-half]").forEach(b=>b.onclick=()=>halftimeChoice(b.dataset.half));if($("simBenchBtn"))$("simBenchBtn").onclick=fullSimBench;if($("tipoffStartBtn"))$("tipoffStartBtn").onclick=()=>{S.fullGame.intro=false;S.fullGame.broadcastLine="Tipoff is underway.";save();render()};document.querySelectorAll("[data-answer-full]").forEach(b=>b.onclick=()=>answerBackFull(b.dataset.answerFull));if($("declineAnswerBtn"))$("declineAnswerBtn").onclick=()=>{S.fullGame.pendingAnswer=null;broadcastAdjust(-1,"The broadcast settles as you stay within the offense.");fullAdvance(32);save();render()};document.querySelectorAll("[data-drill]").forEach(b=>b.onclick=()=>drillTrain(b.dataset.drill));document.querySelectorAll("[data-post]").forEach(b=>b.onclick=()=>socialPost(b.dataset.post));document.querySelectorAll("[data-sponsor]").forEach(b=>b.onclick=()=>signSponsor(b.dataset.sponsor));document.querySelectorAll("[data-buy]").forEach(b=>b.onclick=()=>buyAsset(b.dataset.buy));if($("restBtn"))$("restBtn").onclick=rest;if($("declareDraft"))$("declareDraft").onclick=declareDraft;if($("editAppearance"))$("editAppearance").onclick=openAppearance;document.querySelectorAll("[data-combine]").forEach(b=>b.onclick=()=>combineEvent(b.dataset.combine));if($("draftNightBtn"))$("draftNightBtn").onclick=completeDraftNight;if($("saveProgressBtn"))$("saveProgressBtn").onclick=manualSave;if($("saveProgressCardBtn"))$("saveProgressCardBtn").onclick=manualSave;if($("switchPlayerBtn"))$("switchPlayerBtn").onclick=()=>{save();S=fresh();render()};if($("talkCoachBtn"))$("talkCoachBtn").onclick=talkToCoach;if($("recoverInjuryBtn"))$("recoverInjuryBtn").onclick=sitOutInjury;document.querySelectorAll("[data-contract]").forEach(b=>b.onclick=()=>acceptContract(+b.dataset.contract));if($("nextSeasonBtn"))$("nextSeasonBtn").onclick=startNextSeason}
function createModal(){const temp=fresh().player;modal('<h2>Create My Player</h2><div class="form"><div class="field"><label>Name</label><input id="cName" value="Daniel Rosario"></div><div class="field"><label>Jersey #</label><input id="cNum" type="number" min="0" max="99" value="3"></div><div class="field"><label>Position</label><select id="cPos"><option>PG</option><option>SG</option><option>SF</option><option>PF</option><option>C</option></select></div><div class="field"><label>Height</label><select id="cHeight"><option>6\'1\"</option><option>6\'2\"</option><option selected>6\'3\"</option><option>6\'4\"</option><option>6\'5\"</option><option>6\'6\"</option><option>6\'7\"</option><option>6\'8\"</option></select></div></div><h3>Archetype</h3><div class="choiceGrid" id="choices">'+["Two-Way Creator","Three-Level Scorer","Floor General","Slashing Defender"].map((x,i)=>'<button class="choice '+(i===0?"active":"")+'" data-arch="'+x+'"><b>'+x+'</b></button>').join("")+'</div><h3 style="margin-top:18px">Appearance</h3>'+appearanceEditor("create",temp)+'<div class="modalFoot"><button class="btn" id="cancelCreate">Cancel</button><button class="btn primary" id="finishCreate">Start Career</button></div>');document.querySelectorAll("[data-arch]").forEach(b=>b.onclick=()=>{chosen=b.dataset.arch;document.querySelectorAll("[data-arch]").forEach(x=>x.classList.remove("active"));b.classList.add("active")});wireAppearancePreview("create",temp);$("cNum").oninput=()=>{temp.number=Math.max(0,Math.min(99,+$("cNum").value||0));$("createPreview").innerHTML=avatarMarkup("lg",temp)};$("cancelCreate").onclick=closeModal;$("finishCreate").onclick=finishCreate}
function finishCreate(){activeSlot=pendingNewSlot||activeSlot;localStorage.setItem("mycareer-active-slot",String(activeSlot));S=fresh();S.created=true;S.player.name=$("cName").value.trim()||"Rookie";S.player.number=Math.max(0,Math.min(99,+$("cNum").value||0));S.player.position=$("cPos").value;S.player.height=$("cHeight").value;S.player.archetype=chosen;S.player.appearance=readAppearance("create");if(chosen==="Three-Level Scorer"){S.player.attrs.Shooting=67;S.player.attrs.Finishing=65;S.player.attrs.Defense=54}if(chosen==="Floor General"){S.player.attrs.Playmaking=69;S.player.attrs.IQ=66;S.player.attrs.Shooting=57}if(chosen==="Slashing Defender"){S.player.attrs.Finishing=66;S.player.attrs.Defense=68;S.player.attrs.Athleticism=68;S.player.attrs.Shooting=52}S.news=["Senior season begins. Scouts are watching every possession."];save();closeModal();render();toast("Career created")}
function demo(){pendingNewSlot=activeSlot;S=fresh();S.created=true;S.player.name="D. Rosario";S.player.number=3;S.player.level=4;S.record={w:4,l:1};S.game=6;S.offers=["UConn","Villanova"];S.player.attrs.Shooting=68;S.player.attrs.Playmaking=72;S.player.attrs.Defense=67;S.news=["Two programs have offered scholarships after a strong opening month."];save();render()}
function modal(h){$("modal").innerHTML=h;$("modalWrap").classList.remove("hidden")}function closeModal(){$("modalWrap").classList.add("hidden")}
function badgeRank(name){const b=BADGES.find(x=>x[0]===name);if(!b)return 0;const t=tier(badgeScore(b));return {Locked:0,Bronze:1,Silver:2,Gold:3,Legend:4}[t]||0}
function clutchBadgeBoost(type){
 let names=[];
 if(type==="three")names=["Clutch Shooter","Deadeye","Limitless Range","Catch & Shoot","Killer Instinct","Ice in Veins","Big Game Player"];
 else if(type==="iso")names=["Quick First Step","Posterizer","Fearless Finisher","Slithery Finisher","Killer Instinct","Ice in Veins"];
 else if(type==="pnr")names=["Dimer","Needle Threader","Floor General","Ice in Veins"];
 else names=["Floor General","Dimer","Needle Threader","Big Game Player"];
 return names.reduce((sum,n)=>sum+badgeRank(n)*2.5,0)
}
function defensiveClutchBoost(){return ["Clamps","Challenger","Interceptor","Anchor","Glove","Big Game Player"].reduce((sum,n)=>sum+badgeRank(n)*2,0)}
function clutchResponseChance(type){
 const a=S.player.attrs;
 const base=28+(ovr()-60)*1.15+(a.IQ-55)*.35+(S.player.energy-45)*.12+clutchBadgeBoost(type);
 return Math.max(20,Math.min(94,Math.round(base)))
}
function opponentAnswerChance(){
 const a=S.player.attrs;
 const stop=(a.Defense-55)*.32+(a.IQ-55)*.12+defensiveClutchBoost();
 return Math.max(25,Math.min(72,Math.round(62-stop)))
}
function startMoment(){
 const opp=nextOpp();
 S.live={opp,stage:S.stage,playoff:!!(S.playoffs&&S.playoffs.active),homeAway:S.playoffs&&S.playoffs.active?"PLAYOFF":nextGameLocation(),team:78,oppScore:79,pts:Math.max(8,Math.round(ovr()/3+Math.random()*7)),ast:Math.floor(Math.random()*6),reb:Math.floor(Math.random()*6),clutchPossessions:0,response:false,lastType:null,lastMessage:"Coach puts the ball in your hands."};
 save();render()
}
function momentSkill(t){
 const a=S.player.attrs;
 let base;if(t==="iso")base=(a.Finishing+a.Athleticism)/2;
 else if(t==="three")base=a.Shooting;
 else if(t==="pnr")base=(a.Playmaking+a.IQ)/2;
 else base=(a.IQ+S.player.trust)/2;
 return base+clutchBadgeBoost(t)*.65
}
const MAX_CLUTCH_POSSESSIONS=3;
function openClutchResponseChoice(){
 const g=S.live;if(!g)return;
 modal('<h2>Answer Back • Chance '+((g.clutchPossessions||0)+1)+'/'+MAX_CLUTCH_POSSESSIONS+'</h2><p class="muted">Choose how you want to respond right now.</p><div class="list"><button class="btn primary" data-clutch-response="iso">Attack the Rim</button><button class="btn" data-clutch-response="three">Hunt the Three</button><button class="btn" data-clutch-response="pnr">Run Pick-and-Roll</button><button class="btn" data-clutch-response="team">Make the Team Play</button></div>');
 document.querySelectorAll("[data-clutch-response]").forEach(b=>b.onclick=()=>{const type=b.dataset.clutchResponse;closeModal();if(!S.live)return;S.live.response=true;S.live.lastMessage="Answer-back possession underway.";resolveMoment(type)})
}
function showClutchResult(title,body,canRespond){
 if(!S.live)return;
 const button=canRespond?'<button class="btn primary" id="answerBackBtn">Answer Back • Chance '+((S.live.clutchPossessions||0)+1)+'/'+MAX_CLUTCH_POSSESSIONS+'</button>':'<button class="btn primary" id="finishGameBtn">Conclude Game</button>';
 modal('<h2>'+title+'</h2><p class="muted">'+body+'</p><div class="modalFoot">'+button+'</div>');
 if($("answerBackBtn"))$("answerBackBtn").onclick=openClutchResponseChoice;
 if($("finishGameBtn"))$("finishGameBtn").onclick=finishGame
}
function resolveMoment(t){
 const g=S.live;if(!g)return;
 g.lastType=t;g.clutchPossessions=(g.clutchPossessions||0)+1;g.response=false;
 const success=momentSkill(t)+Math.random()*34>77;
 if(success){
   if(t==="three"){g.team+=3;g.pts+=3}
   else if(t==="pnr"){g.team+=2;g.ast++}
   else {g.team+=2;if(t==="iso")g.pts+=2;if(t==="team")S.player.trust=Math.min(100,S.player.trust+2)}
 }else{
   g.lastMessage="The defense wins the possession.";
   finishGame();return
 }
 const opponentScores=Math.random()*100<opponentAnswerChance();
 if(opponentScores){
   const three=Math.random()<.28,pts=three?3:2;g.oppScore+=pts;
   const chance=clutchResponseChance(t),underCap=g.clutchPossessions<MAX_CLUTCH_POSSESSIONS;
   const canRespond=underCap&&Math.random()*100<chance;
   g.lastMessage="They answered with "+pts+".";
   if(!underCap){
     g.lastMessage="Final clutch exchange complete.";
     finishGame();return
   }else if(canRespond){
     showClutchResult("They answered back","You executed, but "+g.opp+" scored again. You have "+(MAX_CLUTCH_POSSESSIONS-g.clutchPossessions)+" clutch chance"+((MAX_CLUTCH_POSSESSIONS-g.clutchPossessions)===1?"":"s")+" left. Response chance: "+chance+"%. You earned another possession.",true)
   }else{
     g.lastMessage="Opponent answered and no extra response was earned.";
     finishGame();return
   }
 }else{
   g.lastMessage="Your defense gets the stop.";
   if(g.team>g.oppScore){
     g.win=true;
     const finalScore=g.team+"-"+g.oppScore;
     S.news.unshift("Clutch win: "+S.player.name+" delivered and the defense got the stop • "+finalScore+".");
     S.live=null;
     recordGame(g);
     toast("CLUTCH WIN • "+finalScore);
     return
   }
   finishGame();return
 }
}
function quickSim(){const p=S.player,g={opp:nextOpp(),stage:S.stage,playoff:!!(S.playoffs&&S.playoffs.active),homeAway:S.playoffs&&S.playoffs.active?"PLAYOFF":nextGameLocation(),pts:Math.max(5,Math.round(ovr()/3+(Math.random()-.35)*14)),ast:Math.max(0,Math.round(p.attrs.Playmaking/16+Math.random()*4)),reb:Math.max(0,Math.round(p.attrs.Athleticism/20+Math.random()*4))};g.win=ovr()+Math.random()*30>62+Math.random()*35;g.team=Math.round((g.win?88:74)+Math.random()*17);g.oppScore=g.win?g.team-Math.ceil(Math.random()*9):g.team+Math.ceil(Math.random()*9);recordGame(g)}
function finishGame(){
 closeModal();const g=S.live;if(!g)return;
 if(g.team===g.oppScore){
   const otEdge=ovr()+(S.player.attrs.IQ*.2)+clutchBadgeBoost(g.lastType||"team")+Math.random()*30;
   const oppEdge=78+Math.random()*28;
   g.win=otEdge>=oppEdge;
   if(g.win)g.team+=2+Math.floor(Math.random()*5);else g.oppScore+=2+Math.floor(Math.random()*5)
 }else g.win=g.team>g.oppScore;
 S.live=null;recordGame(g)
}
function recordGame(g){S.games.unshift(g);const isPlayoff=!!(S.playoffs&&S.playoffs.active&&S.stage==="NBA");if(!isPlayoff){S.record[g.win?"w":"l"]++;S.game++}const st=S.player.stats,old=st.gp;st.gp++;const ckey=S.stage==="NBA"?"nba":S.stage==="College"?"college":"highSchool";S.careerStats=S.careerStats||{highSchool:{gp:0,pts:0,ast:0,reb:0},college:{gp:0,pts:0,ast:0,reb:0},nba:{gp:0,pts:0,ast:0,reb:0}};const cst=S.careerStats[ckey];cst.gp++;cst.pts+=g.pts;cst.ast+=g.ast;cst.reb+=g.reb;st.ppg=(st.ppg*old+g.pts)/st.gp;st.apg=(st.apg*old+g.ast)/st.gp;st.rpg=(st.rpg*old+g.reb)/st.gp;S.player.energy=Math.max(35,S.player.energy-10);S.player.xp+=90+g.pts*3+g.ast*4+g.reb*2;if(S.stage!=="NBA")S.player.draft=Math.min(99,S.player.draft+(g.pts>=22?3:g.pts>=15?1:0));if(S.stage==="NBA"){S.player.trust=Math.min(100,S.player.trust+coachTrustGain(g));S.player.chemistry=Math.max(20,Math.min(100,S.player.chemistry+(g.win?2:-1)+(g.ast>=6?1:0)));updateRole()}else if(g.win)S.player.trust=Math.min(100,S.player.trust+1);if(g.win)S.player.morale=Math.min(100,S.player.morale+3);else S.player.morale=Math.max(20,S.player.morale-2);while(S.player.xp>=S.player.level*220){S.player.xp-=S.player.level*220;S.player.level++;S.player.attrs.IQ=Math.min(99,S.player.attrs.IQ+1);S.player.attrs.Athleticism=Math.min(99,S.player.attrs.Athleticism+1)}if([2,4,6,8,10,12].includes(st.gp)&&S.offers.length<COLLEGES.length&&!S.college){const pool=COLLEGES.filter(c=>!S.offers.includes(c));S.offers.push(pool[Math.floor(Math.random()*pool.length)])}if(S.stage==="NBA"&&!isPlayoff&&st.gp===41&&st.ppg>=18&&!S.accolades.includes("All-Star")){S.accolades.push("All-Star");S.news.unshift("Selected to the NBA All-Star Game.");pushLeagueNews(S.player.name+" was named an All-Star for "+currentTeamName()+".")}if(isPlayoff){const seriesKey=g.win?"seriesWins":"seriesLosses";S.playoffs[seriesKey]=Math.min(4,(S.playoffs[seriesKey]||0)+1);S.news.unshift((g.win?"Playoff win":"Playoff loss")+" vs "+g.opp+" • Series "+S.playoffs.seriesWins+"-"+S.playoffs.seriesLosses);advancePlayoffRound()}else{S.news.unshift((g.win?"Win":"Loss")+" vs "+g.opp+": "+g.pts+" PTS, "+g.ast+" AST, "+g.reb+" REB.");if(S.stage==="NBA"){simulateOtherTeamsOneGame();ensureLeagueStandings();S.leagueStandings[S.team]={w:S.record.w,l:S.record.l};if(g.pts>=30)pushLeagueNews(S.player.name+" scored "+g.pts+" in "+currentTeamName()+"'s "+(g.win?"win":"loss")+".");maybeInjury()}}S.training=S.training||{used:0,max:3,recovered:false};S.training.used=0;S.training.max=3;S.training.recovered=false;S.social=S.social||{followers:100,fame:0,posted:false,posts:0};S.social.posted=false;let payout=0;payout+=sponsorIncome();if(S.stage==="NBA"&&S.finance.contract)payout+=S.finance.contract.perGame||0;payout+=passiveIncome();if(payout>0){S.finance.cash+=payout;S.finance.earnings+=payout;S.news.unshift("Off-court earnings paid $"+Math.round(payout).toLocaleString()+" after the game.")}if(S.stage==="NBA"&&!isPlayoff&&(S.record.w+S.record.l)>=82)startPlayoffs();save();render();toast(isPlayoff?"Playoff game complete":"Game complete — progress saved")}
function rest(){S.training=S.training||{used:0,max:3,recovered:false};if(S.training.recovered){toast("Recovery already used — play a game to reset");return}S.player.energy=100;S.player.morale=Math.min(100,S.player.morale+2);S.training.max+=3;S.training.recovered=true;save();render();toast("Fully recovered • +3 training sessions")}
function declareDraft(){if(S.stage!=="College"||(S.game-1)<8||S.player.draft<55){toast("Not draft eligible yet");return}S.stage="Draft Combine";S.draftProcess={declared:true,combineDone:false,events:{shooting:false,agility:false,scrimmage:false},boost:0,pick:null};S.live=null;S.news.unshift("You declared for the NBA Draft. Next stop: NBA Draft Combine.");S.training.used=0;S.training.max=3;S.training.recovered=false;save();setScreen("career");toast("NBA Draft Combine unlocked")}
function collegeModal(){if(S.college){toast("Already committed to "+S.college);return}if(!S.offers.length){toast("You need a scholarship offer first");return}modal('<h2>Choose College</h2><p class="muted">This is a one-time commitment. Your player level, XP, attributes, badges, draft stock, and career game history will carry into college.</p><div class="list">'+S.offers.map(c=>'<button class="btn" data-college="'+c+'">'+c+'</button>').join("")+'</div><div class="modalFoot"><button class="btn" id="ccancel">Cancel</button></div>');document.querySelectorAll("[data-college]").forEach(b=>b.onclick=()=>{if(S.college){toast("College already selected");closeModal();return}const school=b.dataset.college;S.careerHistory=S.careerHistory||{highSchool:null,collegeSeasons:[]};S.careerHistory.highSchool={record:{w:S.record.w,l:S.record.l},games:S.game-1,stats:{...S.player.stats},level:S.player.level,ovr:ovr(),draft:S.player.draft};S.college=school;S.stage="College";S.year=1;S.record={w:0,l:0};S.game=1;S.live=null;S.news.unshift("Committed to "+S.college+". Your high-school career is saved and your college season begins.");save();closeModal();setScreen("home");toast("Committed to "+S.college)});$("ccancel").onclick=closeModal}
window.addEventListener("pagehide",()=>{if(S&&S.created)save()});window.addEventListener("error",e=>{console.error("MYCAREER error",e.error||e.message);const content=$("content");if(content&&!content.innerHTML.trim())content.innerHTML='<section class="card s12"><h3>MYCAREER recovered from an error</h3><p class="muted">Tap New Career again. Your save has not been deleted.</p><button class="btn primary" id="recoverBtn">Return Home</button></section>';const r=$("recoverBtn");if(r)r.onclick=()=>{S.screen="home";render()}});$("profileBtn").onclick=()=>S.created?openAppearance():null;$("modalWrap").onclick=e=>{if(e.target===$("modalWrap"))closeModal()};render();
