<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b12">
<title>MYCAREER Basketball Sim v0.3</title>
<style>
:root{--bg:#070b12;--panel:#101722;--panel2:#151e2c;--line:#26344a;--txt:#f6f8fb;--muted:#91a0b5;--orange:#ff6b14;--good:#4bd696;--bad:#ff667c;--gold:#ffd45d;--r:18px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 80% -10%,#1a2842,#070b12 42%);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}
button{cursor:pointer}.hidden{display:none!important}.app{min-height:100vh;display:grid;grid-template-columns:230px 1fr}.side{height:100vh;position:sticky;top:0;border-right:1px solid #182235;background:#080d15;padding:22px;display:flex;flex-direction:column;gap:20px}.brand{font-weight:950;letter-spacing:.8px}.brand span{color:var(--orange)}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.nav{display:grid;gap:7px}.nav button,.bottom button{border:0;background:transparent;color:var(--muted);padding:12px;border-radius:13px;text-align:left;font-weight:750}.nav button.active,.nav button:hover,.bottom button.active{background:#151f2f;color:white}.mini{margin-top:auto;background:#101722;border:1px solid var(--line);padding:14px;border-radius:16px}.main{min-width:0}.top{position:sticky;top:0;z-index:20;height:84px;background:rgba(7,11,18,.88);backdrop-filter:blur(18px);border-bottom:1px solid #141e2e;padding:14px 24px;display:flex;align-items:center;justify-content:space-between}.top p{margin:0;color:#ff9c55;font-size:10px;font-weight:900;letter-spacing:1.4px}.top h1{margin:2px 0 0;font-size:25px}.profile{border:1px solid var(--line);background:#101722;color:#fff;border-radius:14px;padding:7px 10px;display:flex;gap:8px;align-items:center}.profile i{width:36px;height:36px;border-radius:50%;background:linear-gradient(145deg,var(--orange),#ffad54);color:#1d0d00;display:grid;place-items:center;font-style:normal;font-weight:950}.profile small{display:block;color:var(--muted)}.content{max-width:1250px;margin:auto;padding:22px 24px 110px}.hero{display:grid;grid-template-columns:1.5fr .5fr;gap:15px}.heroBox,.card{background:linear-gradient(145deg,#111a29,#0d131d);border:1px solid var(--line);border-radius:22px}.heroBox{padding:26px;min-height:250px;position:relative;overflow:hidden}.heroBox:after{content:"";position:absolute;width:240px;height:240px;border-radius:50%;right:-80px;top:-80px;background:radial-gradient(circle,rgba(255,107,20,.34),transparent 65%)}.kicker{color:#ff9b52;font-size:11px;font-weight:900;letter-spacing:1.3px}.heroBox h2{font-size:40px;line-height:1.02;margin:10px 0}.heroBox p,.muted{color:var(--muted);line-height:1.45}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.btn{border:1px solid var(--line);background:#121a27;color:#fff;padding:12px 15px;border-radius:13px;font-weight:850}.btn.primary{background:linear-gradient(135deg,var(--orange),#ff973d);color:#1b0b00;border:0}.btn.good{background:#153224;border-color:#25553d;color:#9aefbd}.btn.danger{background:#331920;border-color:#632c3a;color:#ff9daf}.ovr{display:grid;place-items:center;padding:20px}.ring{width:138px;height:138px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--orange) var(--p),#28364b 0);padding:10px}.ring>div{width:100%;height:100%;border-radius:50%;background:#0b111b;display:grid;place-items:center;text-align:center}.ring b{font-size:40px}.ring small{display:block;color:var(--muted);font-weight:800}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-top:14px}.card{grid-column:span 4;padding:18px}.card.s6{grid-column:span 6}.card.s8{grid-column:span 8}.card.s12{grid-column:1/-1}.card h3{margin:0 0 12px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #1d2838}.row:last-child{border-bottom:0}.big{font-size:34px;font-weight:950}.pill{display:inline-block;border:1px solid #314158;background:#1b2636;color:#d5deeb;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:900}.pill.good{color:#91edba;background:#153024;border-color:#285640}.pill.bad{color:#ff9bad;background:#351820;border-color:#66303c}.meter{margin:12px 0}.meterTop{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}.bar{height:8px;background:#222e40;border-radius:99px;overflow:hidden}.bar i{height:100%;display:block;background:linear-gradient(90deg,var(--orange),#ffb267)}.list{display:grid;gap:9px}.item{background:#101925;border:1px solid #223149;padding:13px;border-radius:15px;display:flex;justify-content:space-between;gap:10px;align-items:center}.item small{color:var(--muted);display:block;margin-top:3px}.badgeCats{display:grid;gap:18px}.badgeGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.badge{background:#0f1723;border:1px solid #27364c;border-radius:16px;padding:14px}.badgeTop{display:flex;justify-content:space-between;margin-bottom:9px}.tier{font-size:10px;font-weight:950;text-transform:uppercase}.bronze{color:#d99f76}.silver{color:#dfe7f0}.gold{color:#ffd75d}.legend{color:#e3a7ff}.locked{color:#69788e}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;color:var(--muted);font-size:11px;margin:0 0 5px}.field input,.field select{width:100%;background:#0c131e;color:#fff;border:1px solid #293950;border-radius:12px;padding:12px}.choiceGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.choice{border:1px solid #2b3a50;background:#111925;color:white;border-radius:14px;padding:13px;text-align:left}.choice.active{border-color:var(--orange);background:#21170f}.bottom{display:none}.modalWrap{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100;display:grid;place-items:center;padding:18px}.modal{background:#0d141f;border:1px solid #2a394f;border-radius:23px;padding:20px;width:min(650px,100%);max-height:90vh;overflow:auto}.modal h2{margin-top:0}.modalFoot{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:white;color:#0b0f15;border-radius:12px;padding:10px 14px;font-weight:900;z-index:200}
@media(max-width:900px){.app{display:block}.side{display:none}.top{height:76px;padding:12px 14px}.profile div{display:none}.content{padding:14px 12px 100px}.hero{grid-template-columns:1fr}.heroBox{padding:21px;min-height:220px}.heroBox h2{font-size:32px}.ovr{display:none}.card,.card.s6,.card.s8{grid-column:1/-1}.badgeGrid{grid-template-columns:1fr 1fr}.bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;z-index:60;left:9px;right:9px;bottom:calc(8px + env(safe-area-inset-bottom));background:rgba(13,19,29,.95);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:18px;padding:6px}.bottom button{text-align:center;padding:9px 3px;font-size:10px}.form,.choiceGrid{grid-template-columns:1fr}.modalWrap{align-items:end;padding:0}.modal{border-radius:24px 24px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom))}}
@media(max-width:520px){.badgeGrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<aside class="side"><div class="brand">MY<span>CAREER</span><small>BASKETBALL SIMULATOR</small></div><div class="nav" id="deskNav"></div><div class="mini" id="mini"></div></aside>
<main class="main"><header class="top"><div><p id="eyebrow">MYCAREER</p><h1 id="title">Start</h1></div><button class="profile" id="profileBtn"><i id="jersey">0</i><div><b id="pname">Rookie</b><small id="povr">60 OVR</small></div></button></header><section class="content" id="content"></section></main>
<nav class="bottom" id="bottomNav"></nav>
</div>
<div class="modalWrap hidden" id="modalWrap"><div class="modal" id="modal"></div></div><div class="toast hidden" id="toast"></div>
<script>
const NAV=[["home","Home"],["career","Career"],["games","Games"],["player","Player"],["league","League"]];
const TEAMS=["Boston","New York","Miami","Chicago","Atlanta","Dallas","Denver","Phoenix","Los Angeles","Detroit"];
const COLLEGES=["UConn","Duke","Kentucky","Kansas","Michigan State","Villanova","Arizona","North Carolina"];
const TIERS=[["Locked",0],["Bronze",60],["Silver",70],["Gold",82],["Legend",94]];
const BADGES=[
["Catch & Shoot","Shooting","Shooting",1],["Deadeye","Shooting","Shooting",.8,"IQ",.2],["Limitless Range","Shooting","Shooting",.9,"Athleticism",.1],
["Clamps","Defense","Defense",1],["Interceptor","Defense","Defense",.7,"IQ",.3],["Challenger","Defense","Defense",.85,"Athleticism",.15],
["Dimer","Playmaking","Playmaking",.75,"IQ",.25],["Quick First Step","Playmaking","Playmaking",.65,"Athleticism",.35],["Needle Threader","Playmaking","Playmaking",.8,"IQ",.2]
];
const fresh=()=>({version:"0.3.1",created:false,screen:"home",stage:"High School",year:1,game:1,record:{w:0,l:0},college:null,offers:[],games:[],careerHistory:{highSchool:null,collegeSeasons:[]},news:["Create your player and begin your senior season."],player:{name:"Rookie",number:0,age:17,position:"PG",height:"6'3\"",weight:185,hand:"Right",archetype:"Two-Way Creator",level:1,xp:0,energy:100,morale:75,trust:50,fans:120,draft:35,attrs:{Finishing:61,Shooting:59,Playmaking:64,Defense:60,Athleticism:63,IQ:58},stats:{gp:0,ppg:0,apg:0,rpg:0}}});
function merge(a,b){for(const k in b){if(a[k]===undefined)a[k]=b[k];else if(a[k]&&b[k]&&typeof a[k]==="object"&&!Array.isArray(a[k])&&!Array.isArray(b[k]))merge(a[k],b[k])}return a}
function load(){try{return merge(JSON.parse(localStorage.getItem("mycareer-v03")||"{}"),fresh())}catch(e){return fresh()}}
let S=load(),chosen="Two-Way Creator";
const $=id=>document.getElementById(id);
function ovr(){return Math.round(Object.values(S.player.attrs).reduce((a,b)=>a+b,0)/6)}
function save(msg){localStorage.setItem("mycareer-v03",JSON.stringify(S));if(msg)toast(msg)}
function toast(t){$("toast").textContent=t;$("toast").classList.remove("hidden");setTimeout(()=>$("toast").classList.add("hidden"),1300)}
function setScreen(s){S.screen=s;save();render();scrollTo({top:0})}
function nav(){const mk=()=>NAV.map(([id,n])=>'<button class="'+(S.screen===id?"active":"")+'" data-screen="'+id+'">'+n+"</button>").join("");$("deskNav").innerHTML=mk();$("bottomNav").innerHTML=mk();document.querySelectorAll("[data-screen]").forEach(b=>b.onclick=()=>setScreen(b.dataset.screen))}
function head(){const T={home:["CAREER HUB","Home"],career:["MY JOURNEY","Career"],games:["GAME DAY","Games"],player:["PLAYER DEVELOPMENT","Player"],league:["AROUND THE LEAGUE","League"]};const x=T[S.screen]||T.home;$("eyebrow").textContent=x[0];$("title").textContent=S.created?x[1]:"MYCAREER";$("pname").textContent=S.player.name;$("jersey").textContent=S.player.number;$("povr").textContent=ovr()+" OVR";$("mini").innerHTML='<small>'+S.stage+' • Year '+S.year+'</small><div class="big">'+S.record.w+"-"+S.record.l+'</div><div class="muted">Game '+S.game+"</div>"}
function meter(n,v){return '<div class="meter"><div class="meterTop"><span>'+n+'</span><b>'+Math.round(v)+'</b></div><div class="bar"><i style="width:'+Math.max(0,Math.min(100,v))+'%"></i></div></div>'}
function render(){if(!S.careerHistory)S.careerHistory={highSchool:null,collegeSeasons:[]};nav();head();if(!S.created){$("content").innerHTML=startView();bindStart();return}const views={home:home,career:career,games:games,player:player,league:league};$("content").innerHTML=views[S.screen]();bindDynamic()}
function startView(){const has=localStorage.getItem("mycareer-v03");return '<div class="hero"><section class="heroBox"><span class="kicker">YOUR STORY STARTS HERE</span><h2>Build your basketball legacy.</h2><p>Create a player, play through high school, earn offers, develop badges and build your draft stock.</p><div class="actions"><button class="btn primary" id="newBtn">New Career</button>'+(has?'<button class="btn" id="continueBtn">Continue Career</button>':'')+'<button class="btn" id="demoBtn">Demo Career</button></div></section><section class="card ovr"><div class="ring" style="--p:60%"><div><div><b>60</b><small>STARTING OVR</small></div></div></div></section></div><div class="grid"><section class="card s6"><h3>Made for iPhone</h3><p class="muted">Large touch controls, bottom navigation, safe-area spacing and short key-moment gameplay.</p></section><section class="card s6"><h3>Made for PC</h3><p class="muted">Desktop sidebar, wider stat panels and the same career save.</p></section></div>'}
function bindStart(){$("newBtn").onclick=createModal;$("demoBtn").onclick=demo;if($("continueBtn"))$("continueBtn").onclick=()=>{S.created=true;render()}}
function home(){const p=S.player;return '<div class="hero"><section class="heroBox"><span class="kicker">'+S.stage.toUpperCase()+' • GAME '+S.game+'</span><h2>'+p.name.split(" ")[0]+', your career is in your hands.</h2><p>'+S.news[0]+'</p><div class="actions"><button class="btn primary" data-go="games">Play Next Game</button><button class="btn" data-go="player">Train Player</button></div></section><section class="card ovr"><div class="ring" style="--p:'+ovr()+'%"><div><div><b>'+ovr()+'</b><small>OVERALL</small></div></div></div></section></div><div class="grid"><section class="card"><h3>Season</h3>'+row("Record",S.record.w+"-"+S.record.l)+row("PPG",p.stats.ppg.toFixed(1))+row("APG",p.stats.apg.toFixed(1))+row("RPG",p.stats.rpg.toFixed(1))+'</section><section class="card"><h3>Career Pulse</h3>'+meter("Coach Trust",p.trust)+meter("Morale",p.morale)+meter("Draft Stock",p.draft)+meter("Energy",p.energy)+'</section><section class="card"><h3>Profile</h3><div class="big">#'+p.number+'</div><p class="muted">'+p.position+' • '+p.height+' • '+p.archetype+'</p><span class="pill">'+p.level+' LVL</span></section><section class="card s12"><h3>Latest Story</h3><div class="list">'+S.news.slice(0,4).map(n=>'<div class="item"><div><b>MYCAREER</b><small>'+n+'</small></div></div>').join("")+'</div></section></div>'}
function row(a,b){return '<div class="row"><span>'+a+'</span><strong>'+b+'</strong></div>'}
function career(){const hs=S.careerHistory&&S.careerHistory.highSchool;return '<div class="grid" style="margin-top:0"><section class="card s8"><h3>Career Path</h3><div class="list"><div class="item"><div><b>High School Senior</b><small>'+(hs?hs.record.w+"-"+hs.record.l+" final record • "+hs.games+" games":S.player.stats.gp+" games played • "+S.offers.length+" scholarship offers")+'</small></div><span class="pill '+(S.college?"":"good")+'">'+(S.college?"COMPLETE":"ACTIVE")+'</span></div><div class="item"><div><b>College Basketball</b><small>'+(S.college?S.college+" • Year "+S.year:"Earn offers and choose a school")+'</small></div><span class="pill '+(S.college?"good":"")+'">'+(S.college?"COMMITTED":"LOCKED")+'</span></div><div class="item"><div><b>Draft Combine</b><small>Build draft stock through performance and development</small></div><span class="pill">FUTURE</span></div></div></section><section class="card"><h3>'+(S.college?"Commitment":"Offers")+'</h3>'+(S.college?'<div class="big" style="font-size:26px">'+S.college+'</div><p class="muted">Your college choice is locked in for this career.</p><span class="pill good">SIGNED</span>':'<div class="big">'+S.offers.length+'</div><p class="muted">Scholarships</p>'+(S.offers.length?'<button class="btn primary" id="chooseCollege">Choose College</button>':'<span class="pill">Keep playing</span>'))+'</section><section class="card s12"><h3>Recruiting Board</h3><div class="list">'+(S.offers.length?S.offers.map(x=>'<div class="item"><div><b>'+x+'</b><small>'+(S.college===x?"Committed here":"Scholarship offer")+'</small></div><span class="pill '+(S.college===x?"good":"")+'">'+(S.college===x?"COMMITTED":"OFFER")+'</span></div>').join(""):'<div class="item"><div><b>No offers yet</b><small>Strong games will attract programs.</small></div></div>')+'</div></section></div>'}
function nextOpp(){return TEAMS[(S.game-1)%TEAMS.length]}
function games(){if(S.live)return liveGame();const opp=nextOpp();return '<div class="grid" style="margin-top:0"><section class="card s8"><h3>Next Matchup</h3><div class="item"><div><b>'+(S.college||"Northside HS")+' vs '+opp+'</b><small>Game '+S.game+' • Energy '+S.player.energy+'</small></div><span class="pill">NEXT</span></div><div class="actions"><button class="btn primary" id="keyMom">Play Key Moment</button><button class="btn" id="quickSim">Quick Sim</button></div></section><section class="card"><h3>Recent Games</h3><div class="big">'+S.player.stats.gp+'</div><p class="muted">Games played</p></section><section class="card s12"><h3>Results</h3><div class="list">'+(S.games.length?S.games.slice(0,8).map(g=>'<div class="item"><div><b>'+g.opp+'</b><small>'+g.pts+' PTS • '+g.ast+' AST • '+g.reb+' REB</small></div><span class="pill '+(g.win?"good":"bad")+'">'+(g.win?"W ":"L ")+g.team+"-"+g.oppScore+'</span></div>').join(""):'<div class="item"><div><b>No games played</b><small>Your season starts here.</small></div></div>')+'</div></section></div>'}
function liveGame(){const g=S.live;return '<div class="grid" style="margin-top:0"><section class="card s8"><span class="pill bad">4TH • 1:24</span><h3 style="margin-top:14px">'+(S.college||"Northside HS")+' '+g.team+' — '+g.oppScore+' '+g.opp+'</h3><p class="muted">Coach puts the ball in your hands. Choose your action.</p><div class="list"><button class="btn" data-moment="iso">Attack the switch • Finishing + Athleticism</button><button class="btn" data-moment="three">Hunt the three • Shooting</button><button class="btn" data-moment="pnr">Run pick-and-roll • Playmaking + IQ</button><button class="btn" data-moment="team">Make the team play • IQ + Trust</button></div></section><section class="card"><h3>Your Line</h3><div class="big">'+g.pts+'</div>'+row("Assists",g.ast)+row("Rebounds",g.reb)+row("Energy",S.player.energy)+'</section></div>'}
function player(){const p=S.player;const overall=ovr();const best=Object.entries(p.attrs).sort((a,b)=>b[1]-a[1]).slice(0,2);return '<div class="grid" style="margin-top:0"><section class="card s12"><div style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap"><div><span class="kicker">PLAYER OVERVIEW</span><h2 style="margin:5px 0 4px;font-size:28px">'+p.name+'</h2><p class="muted" style="margin:0">'+p.position+' • '+p.height+' • '+p.archetype+' • '+S.stage+(S.college?" • "+S.college:"")+'</p></div><div style="text-align:center;min-width:96px"><div class="big" style="font-size:48px;line-height:1">'+overall+'</div><small class="muted" style="font-weight:900;letter-spacing:1px">OVERALL</small></div></div><div class="actions" style="margin-top:14px"><span class="pill good">LV '+p.level+'</span><span class="pill">'+best[0][0]+' '+best[0][1]+'</span><span class="pill">'+best[1][0]+' '+best[1][1]+'</span></div></section><section class="card s8"><h3>Attributes <span class="pill" style="float:right">'+overall+' OVR</span></h3>'+Object.entries(p.attrs).map(([k,v])=>meter(k,v)).join("")+'</section><section class="card"><h3>Development</h3><div class="big">LV '+p.level+'</div><p class="muted">'+p.xp+'/'+(p.level*220)+' XP</p>'+meter("Energy",p.energy)+meter("Draft Stock",p.draft)+'</section><section class="card s6"><h3>Training Gym</h3><div class="list"><button class="btn" data-train="Shooting">Shooting Workout</button><button class="btn" data-train="Playmaking">Ball Handling</button><button class="btn" data-train="Defense">Defensive Drills</button><button class="btn good" id="restBtn">Recovery Day</button></div></section><section class="card s6"><h3>Badge Rarity</h3><p class="muted">Bronze 60 • Silver 70 • Gold 82 • Legend 94. Every badge is tied to the attributes it actually uses.</p></section><section class="card s12"><h3>Badges</h3><div class="badgeCats">'+["Shooting","Defense","Playmaking"].map(badgeSection).join("")+'</div></section></div>'}
function badgeScore(b){let v=S.player.attrs[b[2]]*b[3];if(b[4])v+=S.player.attrs[b[4]]*b[5];return Math.round(v)}
function tier(v){let t="Locked";TIERS.forEach(x=>{if(v>=x[1])t=x[0]});return t}
function badgeSection(cat){const x=BADGES.filter(b=>b[1]===cat);return '<div><div class="row"><b>'+cat+'</b><span>'+Math.round(x.reduce((s,b)=>s+badgeScore(b),0)/x.length)+'</span></div><div class="badgeGrid">'+x.map(b=>{const sc=badgeScore(b),t=tier(sc);return '<div class="badge"><div class="badgeTop"><b>'+b[0]+'</b><span class="tier '+t.toLowerCase()+'">'+t+'</span></div><small class="muted">'+cat+' fit '+sc+'</small>'+meter("Progress",sc)+'</div>'}).join("")+'</div></div>'}
function league(){return '<div class="grid" style="margin-top:0"><section class="card s8"><h3>Power Rankings</h3>'+TEAMS.slice(0,8).map((t,i)=>'<div class="row"><strong>#'+(i+1)+'</strong><span>'+t+'</span><span>'+(12-i)+'-'+(2+i)+'</span></div>').join("")+'</section><section class="card"><h3>Your Scouting Report</h3><p class="muted">'+scout()+'</p></section></div>'}
function scout(){const a=Object.entries(S.player.attrs).sort((a,b)=>b[1]-a[1]);return S.player.name+' projects as a '+S.player.archetype+'. Strongest areas: '+a[0][0]+' and '+a[1][0]+'. Biggest development need: '+a[a.length-1][0]+'.'}
function bindDynamic(){document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>setScreen(b.dataset.go));if($("chooseCollege"))$("chooseCollege").onclick=collegeModal;if($("keyMom"))$("keyMom").onclick=startMoment;if($("quickSim"))$("quickSim").onclick=quickSim;document.querySelectorAll("[data-moment]").forEach(b=>b.onclick=()=>resolveMoment(b.dataset.moment));document.querySelectorAll("[data-train]").forEach(b=>b.onclick=()=>train(b.dataset.train));if($("restBtn"))$("restBtn").onclick=rest}
function createModal(){modal('<h2>Create My Player</h2><div class="form"><div class="field"><label>Name</label><input id="cName" value="Daniel Rosario"></div><div class="field"><label>Jersey #</label><input id="cNum" type="number" min="0" max="99" value="3"></div><div class="field"><label>Position</label><select id="cPos"><option>PG</option><option>SG</option><option>SF</option><option>PF</option><option>C</option></select></div><div class="field"><label>Height</label><select id="cHeight"><option>6\'1\"</option><option>6\'2\"</option><option selected>6\'3\"</option><option>6\'4\"</option><option>6\'5\"</option><option>6\'6\"</option><option>6\'7\"</option><option>6\'8\"</option></select></div></div><h3>Archetype</h3><div class="choiceGrid" id="choices">'+["Two-Way Creator","Three-Level Scorer","Floor General","Slashing Defender"].map((x,i)=>'<button class="choice '+(i===0?"active":"")+'" data-arch="'+x+'"><b>'+x+'</b></button>').join("")+'</div><div class="modalFoot"><button class="btn" id="cancelCreate">Cancel</button><button class="btn primary" id="finishCreate">Start Career</button></div>');document.querySelectorAll("[data-arch]").forEach(b=>b.onclick=()=>{chosen=b.dataset.arch;document.querySelectorAll("[data-arch]").forEach(x=>x.classList.remove("active"));b.classList.add("active")});$("cancelCreate").onclick=closeModal;$("finishCreate").onclick=finishCreate}
function finishCreate(){S=fresh();S.created=true;S.player.name=$("cName").value.trim()||"Rookie";S.player.number=Math.max(0,Math.min(99,+$("cNum").value||0));S.player.position=$("cPos").value;S.player.height=$("cHeight").value;S.player.archetype=chosen;if(chosen==="Three-Level Scorer"){S.player.attrs.Shooting=67;S.player.attrs.Finishing=65;S.player.attrs.Defense=54}if(chosen==="Floor General"){S.player.attrs.Playmaking=69;S.player.attrs.IQ=66;S.player.attrs.Shooting=57}if(chosen==="Slashing Defender"){S.player.attrs.Finishing=66;S.player.attrs.Defense=68;S.player.attrs.Athleticism=68;S.player.attrs.Shooting=52}S.news=["Senior season begins. Scouts are watching every possession."];save();closeModal();render();toast("Career created")}
function demo(){S=fresh();S.created=true;S.player.name="D. Rosario";S.player.number=3;S.player.level=4;S.record={w:4,l:1};S.game=6;S.offers=["UConn","Villanova"];S.player.attrs.Shooting=68;S.player.attrs.Playmaking=72;S.player.attrs.Defense=67;S.news=["Two programs have offered scholarships after a strong opening month."];save();render()}
function modal(h){$("modal").innerHTML=h;$("modalWrap").classList.remove("hidden")}function closeModal(){$("modalWrap").classList.add("hidden")}
function startMoment(){const opp=nextOpp();S.live={opp,team:78,oppScore:79,pts:Math.max(8,Math.round(ovr()/3+Math.random()*7)),ast:Math.floor(Math.random()*6),reb:Math.floor(Math.random()*6)};save();render()}
function momentSkill(t){const a=S.player.attrs;if(t==="iso")return(a.Finishing+a.Athleticism)/2;if(t==="three")return a.Shooting;if(t==="pnr")return(a.Playmaking+a.IQ)/2;return(a.IQ+S.player.trust)/2}
function resolveMoment(t){const g=S.live,success=momentSkill(t)+Math.random()*38>78;if(success){if(t==="three"){g.team+=3;g.pts+=3}else if(t==="pnr"){g.team+=2;g.ast++}else{g.team+=2;if(t==="iso")g.pts+=2;if(t==="team")S.player.trust=Math.min(100,S.player.trust+2)}}const msg=success?"Big-time play! You execute in the clutch.":"The defense wins the possession.";modal('<h2>'+msg+'</h2><p class="muted">Finish the game to record the result.</p><div class="modalFoot"><button class="btn primary" id="finishGameBtn">Finish Game</button></div>');$("finishGameBtn").onclick=finishGame}
function quickSim(){const p=S.player,g={opp:nextOpp(),pts:Math.max(5,Math.round(ovr()/3+(Math.random()-.35)*14)),ast:Math.max(0,Math.round(p.attrs.Playmaking/16+Math.random()*4)),reb:Math.max(0,Math.round(p.attrs.Athleticism/20+Math.random()*4))};g.win=ovr()+Math.random()*30>62+Math.random()*35;g.team=Math.round((g.win?88:74)+Math.random()*17);g.oppScore=g.win?g.team-Math.ceil(Math.random()*9):g.team+Math.ceil(Math.random()*9);recordGame(g)}
function finishGame(){closeModal();const g=S.live;g.win=Math.random()*100+ovr()/4>60;g.team=g.win?Math.max(g.team,g.oppScore+Math.ceil(Math.random()*5)):g.team;g.oppScore=g.win?Math.min(g.oppScore,g.team-1):Math.max(g.oppScore,g.team+Math.ceil(Math.random()*5));S.live=null;recordGame(g)}
function recordGame(g){S.games.unshift(g);S.record[g.win?"w":"l"]++;S.game++;const st=S.player.stats,old=st.gp;st.gp++;st.ppg=(st.ppg*old+g.pts)/st.gp;st.apg=(st.apg*old+g.ast)/st.gp;st.rpg=(st.rpg*old+g.reb)/st.gp;S.player.energy=Math.max(35,S.player.energy-10);S.player.xp+=90+g.pts*3+g.ast*4+g.reb*2;S.player.draft=Math.min(99,S.player.draft+(g.pts>=22?3:g.pts>=15?1:0));if(g.win)S.player.morale=Math.min(100,S.player.morale+3);else S.player.morale=Math.max(20,S.player.morale-2);while(S.player.xp>=S.player.level*220){S.player.xp-=S.player.level*220;S.player.level++;S.player.attrs.IQ=Math.min(99,S.player.attrs.IQ+1);S.player.attrs.Athleticism=Math.min(99,S.player.attrs.Athleticism+1)}if([2,4,6,8,10,12].includes(st.gp)&&S.offers.length<COLLEGES.length&&!S.college){const pool=COLLEGES.filter(c=>!S.offers.includes(c));S.offers.push(pool[Math.floor(Math.random()*pool.length)])}S.news.unshift((g.win?"Win":"Loss")+" vs "+g.opp+": "+g.pts+" PTS, "+g.ast+" AST, "+g.reb+" REB.");save();render();toast(g.win?"Big win!":"Game complete")}
function train(k){if(S.player.energy<20){toast("Too tired — recover first");return}S.player.energy-=15;const gain=Math.random()>.55?2:1;S.player.attrs[k]=Math.min(99,S.player.attrs[k]+gain);S.player.xp+=50;S.player.draft=Math.min(99,S.player.draft+1);let leveled=false;while(S.player.xp>=S.player.level*220){S.player.xp-=S.player.level*220;S.player.level++;S.player.attrs.IQ=Math.min(99,S.player.attrs.IQ+1);S.player.attrs.Athleticism=Math.min(99,S.player.attrs.Athleticism+1);leveled=true}save();render();toast(leveled?"Level "+S.player.level+" reached!":k+" +"+gain)}
function rest(){S.player.energy=Math.min(100,S.player.energy+25);S.player.morale=Math.min(100,S.player.morale+2);save();render();toast("Recovered")}
function collegeModal(){if(S.college){toast("Already committed to "+S.college);return}if(!S.offers.length){toast("You need a scholarship offer first");return}modal('<h2>Choose College</h2><p class="muted">This is a one-time commitment. Your player level, XP, attributes, badges, draft stock, and career game history will carry into college.</p><div class="list">'+S.offers.map(c=>'<button class="btn" data-college="'+c+'">'+c+'</button>').join("")+'</div><div class="modalFoot"><button class="btn" id="ccancel">Cancel</button></div>');document.querySelectorAll("[data-college]").forEach(b=>b.onclick=()=>{if(S.college){toast("College already selected");closeModal();return}const school=b.dataset.college;S.careerHistory=S.careerHistory||{highSchool:null,collegeSeasons:[]};S.careerHistory.highSchool={record:{w:S.record.w,l:S.record.l},games:S.game-1,stats:{...S.player.stats},level:S.player.level,ovr:ovr(),draft:S.player.draft};S.college=school;S.stage="College";S.year=1;S.record={w:0,l:0};S.game=1;S.live=null;S.news.unshift("Committed to "+S.college+". Your high-school career is saved and your college season begins.");save();closeModal();setScreen("home");toast("Committed to "+S.college)});$("ccancel").onclick=closeModal}
$("profileBtn").onclick=()=>S.created&&setScreen("player");$("modalWrap").onclick=e=>{if(e.target===$("modalWrap"))closeModal()};render();
</script>
</body>
</html>
